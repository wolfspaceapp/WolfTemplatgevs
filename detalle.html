<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>NekoWolf — Detalle</title>
<style>
  :root{
    --accent:#f47521;
    --accent-2:#ff9a52;
    --bg:#0a0a0a;
    --bg2:#141414;
    --card:#1a1a1a;
    --text:#ffffff;
    --muted:#9b9b9b;
    --border:rgba(255,255,255,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overflow-x:hidden;
  }
  img{display:block;max-width:100%;}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  svg{fill:currentColor;}
  a{color:inherit;text-decoration:none;}

  /* ====== Keyframes ====== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(244,117,33,.55);}
    50%{box-shadow:0 0 0 14px rgba(244,117,33,0);}
  }
  @keyframes floatPoster{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
  /* --- Ken Burns: paneo + zoom continuo en bucle para la imagen de fondo --- */
  @keyframes kenBurns{
    0%{transform:scale(1.15) translate3d(0,0,0);}
    50%{transform:scale(1.28) translate3d(-3%,-2.5%,0);}
    100%{transform:scale(1.15) translate3d(0,0,0);}
  }
  /* --- Brillo/gradiente animado que recorre el backdrop --- */
  @keyframes sheen{
    0%{transform:translateX(-120%) rotate(8deg);}
    100%{transform:translateX(220%) rotate(8deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .hero-bg,.poster{animation:none !important;}
  }

  .reveal{opacity:0;animation:fadeUp .7s cubic-bezier(.22,.61,.36,1) forwards;}
  .d1{animation-delay:.15s;}.d2{animation-delay:.28s;}.d3{animation-delay:.4s;}
  .d4{animation-delay:.52s;}.d5{animation-delay:.64s;}.d6{animation-delay:.76s;}

  /* ====== Top bar ====== */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:linear-gradient(180deg,rgba(10,10,10,.85),rgba(10,10,10,0));
    transition:background .35s ease, backdrop-filter .35s ease;
  }
  .topbar.solid{
    background:rgba(10,10,10,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .round-btn{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,20,20,.55);backdrop-filter:blur(6px);
    color:#fff;transition:transform .2s, background .2s;
  }
  .round-btn:active{transform:scale(.9);background:rgba(244,117,33,.35);}
  .round-btn svg{width:22px;height:22px;}
  .top-actions{display:flex;gap:10px;}

  /* ====== Hero ====== */
  .hero{position:relative;width:100%;min-height:78vh;overflow:hidden;}
  /* wrapper para parallax (lo movemos con JS) */
  .hero-bg-wrap{position:absolute;inset:0;overflow:hidden;will-change:transform;}
  .hero-bg{
    position:absolute;inset:-6% ;   /* overscan para que el paneo no muestre bordes */
    background-size:cover;background-position:center;
    transform-origin:center;
    animation:kenBurns 26s ease-in-out infinite;
    will-change:transform;
  }
  .hero-bg::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg,rgba(10,10,10,.35) 0%,rgba(10,10,10,0) 30%,rgba(10,10,10,.75) 72%,var(--bg) 100%),
      linear-gradient(90deg,rgba(10,10,10,.55),rgba(10,10,10,0) 60%);
  }
  /* destello que recorre el fondo */
  .hero-sheen{
    position:absolute;top:-30%;left:0;width:45%;height:160%;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,0) 100%);
    filter:blur(6px);
    animation:sheen 9s ease-in-out infinite;
    animation-delay:1.5s;
  }
  .hero-inner{
    position:relative;z-index:2;
    display:flex;align-items:flex-end;gap:18px;
    padding:0 20px 24px;min-height:78vh;
  }
  .poster{
    flex:0 0 128px;width:128px;height:190px;border-radius:14px;overflow:hidden;
    background:var(--bg2);
    box-shadow:0 14px 34px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.12);
    animation:floatPoster 6s ease-in-out infinite;
  }
  .poster img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;background:var(--bg2);}
  .hero-meta{flex:1;min-width:0;padding-bottom:4px;}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .badge{
    font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);
    border:1px solid var(--border);
  }
  .badge.accent{background:var(--accent);color:#fff;border-color:transparent;}
  .badge.hd{color:var(--accent-2);border-color:rgba(244,117,33,.5);}
  h1.title{
    font-size:26px;line-height:1.15;font-weight:800;margin-bottom:8px;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  .sub-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;color:var(--muted);font-size:13.5px;font-weight:600;}
  .sub-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);}
  .rating{display:inline-flex;align-items:center;gap:4px;color:#ffd04a;}
  .rating svg{width:15px;height:15px;}

  /* ====== Content ====== */
  .content{
    position:relative;z-index:3;margin-top:-6px;
    padding:4px 20px 60px;max-width:760px;
  }

  /* CTA buttons */
  .cta-row{display:flex;gap:12px;margin:6px 0 22px;}
  .btn-play{
    flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
    padding:15px 20px;border-radius:14px;font-size:16px;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;animation:pulseGlow 2.6s ease-in-out infinite;
    transition:transform .18s;
  }
  .btn-play:active{transform:scale(.96);}
  .btn-play svg{width:22px;height:22px;}
  .btn-ghost{
    width:54px;height:54px;flex:0 0 auto;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--border);
    transition:transform .18s, background .2s, color .2s;
  }
  .btn-ghost:active{transform:scale(.9);}
  .btn-ghost.on{color:var(--accent);background:rgba(244,117,33,.14);border-color:rgba(244,117,33,.4);}
  .btn-ghost svg{width:24px;height:24px;}

  /* Genre chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .chip{
    font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;
    background:var(--card);border:1px solid var(--border);color:#ddd;
    transition:transform .15s, border-color .2s;
  }
  .chip:active{transform:scale(.94);border-color:var(--accent);}

  /* ====== TABS (línea inferior en la activa) ====== */
  .tabs{
    position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:30;
    display:flex;gap:4px;margin:0 -20px 20px;padding:0 20px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .tabs::-webkit-scrollbar{height:0;}
  .tab{
    flex:0 0 auto;position:relative;padding:14px 14px 13px;
    font-size:14.5px;font-weight:700;color:var(--muted);white-space:nowrap;
    background:none;border:none;
    transition:color .25s;
  }
  .tab::after{
    content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;
    border-radius:3px 3px 0 0;background:var(--accent);
    transform:scaleX(0);transform-origin:center;opacity:0;
    transition:transform .3s cubic-bezier(.22,.61,.36,1), opacity .25s;
  }
  .tab:active{color:#fff;}
  .tab.active{color:#fff;}
  .tab.active::after{transform:scaleX(1);opacity:1;}

  .tab-panel{animation:fadeIn .35s ease;}
  .tab-panel[hidden]{display:none;}

  /* Section */
  .section{margin-bottom:28px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .section-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .section-title::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--accent);}

  .synopsis{color:#cfcfcf;font-size:15px;line-height:1.7;}
  .synopsis.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;}
  .read-more{margin-top:8px;color:var(--accent);font-weight:700;font-size:14px;}

  /* Info grid */
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .info-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px;transition:transform .2s, border-color .2s;
  }
  .info-card:active{transform:translateY(-2px);border-color:rgba(244,117,33,.4);}
  .info-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
  .info-value{font-size:15px;font-weight:700;}

  /* ====== Serie: controles (temporada <select> nativo + ordenar) ====== */
  .ep-controls{display:flex;align-items:center;gap:10px;}
  .native-season{
    position:relative;display:flex;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding-left:12px;transition:border-color .2s;
  }
  .native-season:focus-within{border-color:rgba(244,117,33,.6);}
  .native-season svg.lead{width:18px;height:18px;color:#fff;pointer-events:none;}
  /* El <select> nativo: en Android/WebView abre el diálogo/lista nativo del sistema */
  .native-season select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    background:transparent;color:#fff;font-size:14px;font-weight:700;
    border:none;outline:none;padding:10px 34px 10px 8px;cursor:pointer;
    max-width:180px;text-overflow:ellipsis;
  }
  .native-season select option{color:#111;}
  .native-season svg.caret{
    position:absolute;right:10px;width:18px;height:18px;color:#fff;pointer-events:none;
  }
  .sort-btn{
    display:flex;align-items:center;gap:7px;
    padding:11px 12px;border-radius:11px;font-size:14px;font-weight:700;
    background:var(--card);border:1px solid var(--border);color:#fff;
    transition:transform .15s, border-color .2s;
  }
  .sort-btn:active{transform:scale(.95);}
  .sort-btn svg{width:18px;height:18px;transition:transform .3s;}
  .sort-btn.desc svg{transform:scaleY(-1);}

  /* ====== Lista de episodios (tarjetas) ====== */
  .ep-list{display:flex;flex-direction:column;gap:12px;}
  .ep-item{
    display:flex;gap:13px;padding:10px;border-radius:14px;
    background:var(--card);border:1px solid var(--border);cursor:pointer;
    animation:popIn .4s ease both;
    transition:transform .18s, border-color .2s, background .2s;
  }
  .ep-item:active{transform:scale(.985);border-color:rgba(244,117,33,.45);background:#1f1f22;}
  .ep-thumb{
    position:relative;flex:0 0 132px;width:132px;height:78px;border-radius:10px;overflow:hidden;
    background:var(--bg2);
  }
  .ep-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
  .ep-item:active .ep-thumb img{transform:scale(1.07);}
  .ep-thumb .play-ov{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.25);
  }
  .ep-thumb .play-ov svg{width:30px;height:30px;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
  .ep-dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;}
  .ep-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .ep-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .ep-num{font-size:12px;font-weight:800;color:var(--accent);background:rgba(244,117,33,.14);padding:2px 8px;border-radius:6px;}
  .ep-title{font-size:14.5px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ep-desc{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* Cast */
  .cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:18px 10px;}
  .cast-card{text-align:center;}
  .cast-img{width:76px;height:76px;border-radius:50%;overflow:hidden;border:2px solid var(--border);margin:0 auto 8px;}
  .cast-img img{width:100%;height:100%;object-fit:cover;}
  .cast-name{font-size:12px;font-weight:700;line-height:1.2;}
  .cast-role{font-size:11px;color:var(--muted);}

  /* Player modal */
  .player{
    position:fixed;inset:0;z-index:100;background:#000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .player.open{opacity:1;pointer-events:auto;}
  .player-close{
    position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:2;
    width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
  }
  .player-close svg{width:24px;height:24px;fill:#fff;}
  .player-box{width:100%;max-width:900px;aspect-ratio:16/9;background:#111;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted);}
  .player-box svg{width:64px;height:64px;fill:var(--accent);}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);
    transform:translateX(-50%) translateY(20px);
    background:#fff;color:#111;font-weight:700;font-size:14px;
    padding:12px 20px;border-radius:999px;z-index:120;
    opacity:0;transition:opacity .3s, transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(min-width:680px){
    .poster{flex-basis:168px;width:168px;height:248px;}
    h1.title{font-size:34px;}
    .hero{min-height:70vh;}
    .hero-inner{min-height:70vh;}
  }
</style>
</head>
<body>

  <!-- ===== Top bar ===== -->
  <header class="topbar" id="topbar">
    <button class="round-btn" aria-label="Volver" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
    </button>
  </header>

  <!-- ===== Hero ===== -->
  <section class="hero">
    <div class="hero-bg-wrap" id="heroWrap">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-sheen"></div>
    </div>
    <div class="hero-inner">
      <div class="poster reveal d1" id="poster"><img id="posterImg" alt="Poster" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450/1a1a1a/f47521?text=Poster';" /></div>
      <div class="hero-meta">
        <div class="badges reveal d2" id="badges"></div>
        <h1 class="title reveal d3" id="animeTitle">Título</h1>
        <div class="sub-meta reveal d4" id="subMeta">
          <span class="rating">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            <span id="metaRating">0.0</span>
          </span>
          <span class="dot"></span><span id="metaYear">2024</span>
          <span class="dot"></span><span id="metaType">Tipo</span>
          <span class="dot"></span><span id="metaExtra">—</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Content ===== -->
  <div class="content">

    <div class="cta-row reveal d4">
      <button class="btn-play" id="btnPlay">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span id="btnPlayLabel">Reproducir</span>
      </button>
      <button class="btn-ghost" id="btnFav" aria-label="Mi lista" title="Mi lista">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
      <button class="btn-ghost" id="btnDownload" aria-label="Descargar" title="Descargar">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>
    </div>

    <div class="chips reveal d5" id="genreChips"></div>

    <!-- ===== TABS ===== -->
    <nav class="tabs reveal d5" id="tabs"></nav>

    <!-- ===== Panel: Sinopsis ===== -->
    <section class="tab-panel" id="panel-sinopsis">
      <div class="section">
        <h2 class="section-title">Sinopsis</h2>
        <p class="synopsis clamp" id="synopsis"></p>
        <div class="read-more" id="readMore">Leer más ▾</div>
      </div>
    </section>

    <!-- ===== Panel: Reparto ===== -->
    <section class="tab-panel" id="panel-reparto" hidden>
      <div class="section">
        <h2 class="section-title">Reparto de voces</h2>
        <div class="cast-grid" id="castGrid"></div>
      </div>
    </section>

    <!-- ===== Panel: Info ===== -->
    <section class="tab-panel" id="panel-info" hidden>
      <div class="section">
        <h2 class="section-title">Información</h2>
        <div class="info-grid" id="infoGrid"></div>
      </div>
    </section>

    <!-- ===== Episodios (NO es tab) — va abajo de todo, solo en serie ===== -->
    <section class="section" id="episodesSection" hidden>
      <div class="section-head">
        <h2 class="section-title">Episodios</h2>
        <div class="ep-controls">
          <!-- Selector de temporada con <select> NATIVO (lista/diálogo de Android) -->
          <label class="native-season" for="seasonSelect">
            <svg class="lead" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            <select id="seasonSelect" aria-label="Seleccionar temporada"></select>
            <svg class="caret" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </label>
          <button class="sort-btn" id="sortBtn" title="Ordenar">
            <svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3zm0-5h12v-2H3zm0-7v2h18V6z"/></svg>
          </button>
        </div>
      </div>
      <div class="ep-list" id="epList"></div>
    </section>

  </div>

  <!-- ===== Player modal ===== -->
  <div class="player" id="player">
    <button class="player-close" id="playerClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <div class="player-box" id="playerBox">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span id="playerLabel">Reproduciendo…</span>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

<script>
/* ============================================================
   DATOS — Cambia "type" a "pelicula" o "serie"
   ------------------------------------------------------------
   Tabs (ambos modos): Sinopsis · Reparto · Información
   type:"pelicula"  → solo botón Reproducir
   type:"serie"     → añade la sección "Episodios" DEBAJO de las tabs
                      (temporadas con <select> nativo + ordenar)
   ============================================================ */

/* ---- EJEMPLO SERIE (activo) ---- */
const ANIME = {
  type: "serie",                        // "serie" | "pelicula"
  title: "Jujutsu Kaisen",
  year: 2024,
  rating: 8.7,
  status: "En emisión",
  studio: "MAPPA",
  duration: "24 min/ep",
  audio: "Japonés · Latino",
  director: "Sunghoo Park",
  poster: "https://image.tmdb.org/t/p/w500/fHpKWq9ayzSk8nSwqRuaAUemRKh.jpg",
  backdrop: "https://image.tmdb.org/t/p/original/vIgyYkXkg6NC2whRbYjBD7eb3Er.jpg",
  badges: ["Simulcast", "HD 1080p", "SUB · DOB", "16+"],
  genres: ["Acción", "Shounen", "Sobrenatural", "Fantasía", "Terror"],

/* ---- EJEMPLO PELÍCULA (copia esto sobre ANIME para probar el modo película) ----
const ANIME = {
  type: "pelicula",
  title: "Jujutsu Kaisen 0",
  year: 2021,
  rating: 7.9,
  status: "Estreno",
  studio: "MAPPA",
  duration: "1h 45m",
  audio: "Japonés · Latino",
  director: "Sunghoo Park",
  poster: "https://image.tmdb.org/t/p/w500/fHpKWq9ayzSk8nSwqRuaAUemRKh.jpg",
  backdrop: "https://image.tmdb.org/t/p/original/vIgyYkXkg6NC2whRbYjBD7eb3Er.jpg",
  badges: ["Película", "HD 1080p", "SUB · DOB", "16+"],
  genres: ["Acción", "Sobrenatural", "Fantasía"],
  synopsis: "Yuta Okkotsu es un adolescente atormentado por Rika, su amiga de la infancia convertida en una maldición...",
  cast: [ { name:"Yuta", role:"M. Ogata", img:"https://i.pravatar.cc/150?img=5" } ]
};
---------------------------------------------------------------------------------- */

/* ============================================================
   ESTADO
   ============================================================ */
const isMovie = ANIME.type === "pelicula";
let currentSeason = 0;
let sortAsc = true;

const $ = (id) => document.getElementById(id);

/* ============================================================
   RENDER BASE
   ============================================================ */
(function renderBase(){
  document.title = "NekoWolf — " + ANIME.title;
  $("heroBg").style.backgroundImage = `url('${ANIME.backdrop}')`;
  $("posterImg").src = ANIME.poster;
  $("animeTitle").textContent = ANIME.title;
  $("metaRating").textContent = ANIME.rating;
  $("metaYear").textContent = ANIME.year;
  $("metaType").textContent = isMovie ? "Película" : "Serie TV";
  $("synopsis").textContent = ANIME.synopsis;
  $("metaExtra").textContent = isMovie ? ANIME.duration : (totalEpisodes() + " Episodios");

  $("badges").innerHTML = (ANIME.badges || []).map((b,i) => {
    const cls = i === 0 ? "badge accent" : (/HD|1080|720|4K/i.test(b) ? "badge hd" : "badge");
    return `<span class="${cls}">${b}</span>`;
  }).join("");

  $("genreChips").innerHTML =
    (ANIME.genres || []).map(g => `<span class="chip">${g}</span>`).join("");

  $("btnPlayLabel").textContent = isMovie ? "Reproducir película" : "Reproducir E1";

  $("castGrid").innerHTML = (ANIME.cast || []).map(p => `
    <div class="cast-card">
      <div class="cast-img"><img src="${p.img}" alt="${p.name}" /></div>
      <div class="cast-name">${p.name}</div>
      <div class="cast-role">${p.role}</div>
    </div>`).join("");

  const info = [
    ["Estado", ANIME.status],
    ["Estudio", ANIME.studio],
    ["Duración", ANIME.duration],
    ["Audio", ANIME.audio],
    ["Director", ANIME.director],
    ["Año", ANIME.year]
  ].filter(([,v]) => v != null && v !== "");
  $("infoGrid").innerHTML = info.map(([l,v]) => `
    <div class="info-card"><div class="info-label">${l}</div><div class="info-value">${v}</div></div>`).join("");
})();

function totalEpisodes(){
  return (ANIME.seasons || []).reduce((s, t) => s + (t.episodes?.length || 0), 0);
}

/* ============================================================
   TABS
   ============================================================ */
(function buildTabs(){
  // Episodios ya NO es tab (va como sección aparte, debajo de todo)
  const tabsDef = [["sinopsis","Sinopsis"],["reparto","Reparto"],["info","Información"]];

  $("tabs").innerHTML = tabsDef
    .map((t,i) => `<button class="tab ${i===0?'active':''}" data-tab="${t[0]}">${t[1]}</button>`)
    .join("");

  const panels = ["sinopsis","reparto","info"];
  function show(tab){
    panels.forEach(p => { const el = $("panel-"+p); if(el) el.hidden = (p !== tab); });
    $("tabs").querySelectorAll(".tab").forEach(b =>
      b.classList.toggle("active", b.dataset.tab === tab));
  }
  $("tabs").querySelectorAll(".tab").forEach(b =>
    b.addEventListener("click", () => show(b.dataset.tab)));
  show(tabsDef[0][0]);
})();

/* ============================================================
   MODO SERIE — temporadas (select nativo), ordenar, episodios
   ============================================================ */
if (!isMovie && ANIME.seasons && ANIME.seasons.length){
  $("episodesSection").hidden = false;   // mostrar la sección (abajo de todo)
  const seasonSelect = $("seasonSelect");
  const sortBtn      = $("sortBtn");
  const epList       = $("epList");

  // Poblamos el <select> nativo → en Android abre la lista/diálogo del sistema
  seasonSelect.innerHTML = ANIME.seasons
    .map((t,i) => `<option value="${i}">${t.name} · ${t.episodes.length} ep</option>`)
    .join("");
  seasonSelect.value = String(currentSeason);
  seasonSelect.addEventListener("change", () => {
    currentSeason = +seasonSelect.value;
    renderEpisodes();
  });

  sortBtn.addEventListener("click", () => {
    sortAsc = !sortAsc;
    sortBtn.classList.toggle("desc", !sortAsc);
    sortBtn.title = sortAsc ? "Más antiguos primero" : "Más recientes primero";
    renderEpisodes();
    toast(sortAsc ? "Orden: ascendente" : "Orden: descendente");
  });

  function renderEpisodes(){
    const eps = [...ANIME.seasons[currentSeason].episodes]
      .sort((a,b) => sortAsc ? a.n - b.n : b.n - a.n);
    epList.innerHTML = eps.map((ep,i) => `
      <div class="ep-item" data-ep="${ep.n}" style="animation-delay:${i*45}ms">
        <div class="ep-thumb">
          <img src="${ep.thumb}" alt="EP ${ep.n}" />
          <span class="ep-dur">${ep.dur}</span>
          <div class="play-ov"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        </div>
        <div class="ep-info">
          <div class="ep-top">
            <span class="ep-num">E${ep.n}</span>
            <span class="ep-title">${ep.title}</span>
          </div>
          <div class="ep-desc">${ep.desc || ""}</div>
        </div>
      </div>`).join("");
    epList.querySelectorAll(".ep-item").forEach(c =>
      c.addEventListener("click", () =>
        openPlayer(`${ANIME.seasons[currentSeason].name} · Episodio ${c.dataset.ep}`)));
  }
  renderEpisodes();

  $("btnPlay").addEventListener("click", () => {
    const first = [...ANIME.seasons[currentSeason].episodes].sort((a,b)=>a.n-b.n)[0];
    openPlayer(`${ANIME.seasons[currentSeason].name} · Episodio ${first ? first.n : 1}`);
  });
} else {
  $("btnPlay").addEventListener("click", () => openPlayer(ANIME.title));
}

/* ===== Leer más / menos ===== */
const syn = $("synopsis");
$("readMore").addEventListener("click", function(){
  const clamped = syn.classList.toggle("clamp");
  this.textContent = clamped ? "Leer más ▾" : "Leer menos ▴";
});

/* ===== Favorito / Descargar ===== */
$("btnFav").addEventListener("click", function(){
  this.classList.toggle("on");
  toast(this.classList.contains("on") ? "Añadido a Mi lista" : "Quitado de Mi lista");
});
$("btnDownload").addEventListener("click", () => toast("Descarga iniciada"));

/* ===== Reproductor ===== */
const player = $("player");
function openPlayer(label){
  $("playerLabel").textContent = "Reproduciendo: " + label;
  player.classList.add("open");
  document.body.style.overflow = "hidden";
}
$("playerClose").addEventListener("click", () => {
  player.classList.remove("open");
  document.body.style.overflow = "";
});

/* ===== Scroll: topbar sólida + PARALLAX del fondo ===== */
const topbar = $("topbar");
const heroWrap = $("heroWrap");
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  topbar.classList.toggle("solid", y > 60);
  // Parallax: el fondo se mueve más lento que el scroll
  heroWrap.style.transform = `translate3d(0, ${y * 0.4}px, 0)`;
}, { passive:true });

/* ===== Toast ===== */
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}
</script>
</body>
</html>
