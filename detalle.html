<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>NekoWolf — Detalle</title>
<style>
  :root{
    --accent:#f47521;
    --accent-2:#ff9a52;
    --bg:#0a0a0a;
    --bg2:#141414;
    --card:#1a1a1a;
    --text:#ffffff;
    --muted:#9b9b9b;
    --border:rgba(255,255,255,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overflow-x:hidden;
  }
  img{display:block;max-width:100%;}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  svg{fill:currentColor;}
  a{color:inherit;text-decoration:none;}

  /* ====== Keyframes ====== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(244,117,33,.55);}
    50%{box-shadow:0 0 0 14px rgba(244,117,33,0);}
  }
  @keyframes floatPoster{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
  /* deslizamiento direccional de paneles al hacer swipe entre tabs */
  @keyframes panelInRight{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:translateX(0);}}
  @keyframes panelInLeft{from{opacity:0;transform:translateX(-28px);}to{opacity:1;transform:translateX(0);}}
  /* --- Ken Burns: paneo + zoom continuo en bucle para la imagen de fondo --- */
  @keyframes kenBurns{
    0%{transform:scale(1.15) translate3d(0,0,0);}
    50%{transform:scale(1.28) translate3d(-3%,-2.5%,0);}
    100%{transform:scale(1.15) translate3d(0,0,0);}
  }
  /* --- Brillo/gradiente animado que recorre el backdrop --- */
  @keyframes sheen{
    0%{transform:translateX(-120%) rotate(8deg);}
    100%{transform:translateX(220%) rotate(8deg);}
  }
  .reveal{opacity:0;animation:fadeUp .7s cubic-bezier(.22,.61,.36,1) forwards;}
  .d1{animation-delay:.15s;}.d2{animation-delay:.28s;}.d3{animation-delay:.4s;}
  .d4{animation-delay:.52s;}.d5{animation-delay:.64s;}.d6{animation-delay:.76s;}

  @media (prefers-reduced-motion: reduce){
    /* sin movimiento, pero NADA debe quedar invisible */
    .hero-bg,.poster,.reveal,.ep-item{animation:none !important;}
    .reveal,.ep-item{opacity:1 !important;}
  }

  /* ====== Top bar ====== */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;
    background:linear-gradient(180deg,rgba(10,10,10,.85),rgba(10,10,10,0));
    transition:background .35s ease, backdrop-filter .35s ease;
  }
  .topbar.solid{
    background:rgba(10,10,10,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .round-btn{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,20,20,.55);backdrop-filter:blur(6px);
    color:#fff;transition:transform .2s, background .2s;
  }
  .round-btn:active{transform:scale(.9);background:rgba(244,117,33,.35);}
  .round-btn svg{width:20px;height:20px;}
  .top-actions{display:flex;gap:8px;}

  /* ====== Hero ====== */
  .hero{position:relative;width:100%;min-height:46vh;overflow:hidden;}
  /* wrapper para parallax (lo movemos con JS) */
  .hero-bg-wrap{position:absolute;inset:0;overflow:hidden;will-change:transform;}
  .hero-bg{
    position:absolute;inset:-6% ;   /* overscan para que el paneo no muestre bordes */
    background-size:cover;background-position:center;
    transform-origin:center;
    animation:kenBurns 26s ease-in-out infinite;
    will-change:transform;
  }
  .hero-bg::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg,rgba(10,10,10,.35) 0%,rgba(10,10,10,0) 30%,rgba(10,10,10,.75) 72%,var(--bg) 100%),
      linear-gradient(90deg,rgba(10,10,10,.55),rgba(10,10,10,0) 60%);
  }
  /* destello que recorre el fondo */
  .hero-sheen{
    position:absolute;top:-30%;left:0;width:45%;height:160%;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,0) 100%);
    filter:blur(6px);
    animation:sheen 9s ease-in-out infinite;
    animation-delay:1.5s;
  }
  /* Botón favorito en la barra superior */
  .fav-btn svg{width:22px;height:22px;transition:transform .25s;}
  .fav-btn.on{color:#ff4d5e;background:rgba(255,77,94,.18);}
  .fav-btn.on svg{animation:favPop .45s ease;}
  @keyframes favPop{0%{transform:scale(1);}35%{transform:scale(1.4);}70%{transform:scale(.9);}100%{transform:scale(1);}}

  .hero-inner{
    position:relative;z-index:2;
    display:flex;align-items:flex-end;gap:14px;
    padding:0 16px 18px;min-height:46vh;
  }
  .poster{
    flex:0 0 112px;width:112px;height:166px;border-radius:13px;overflow:hidden;
    background:var(--bg2);
    box-shadow:0 14px 34px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.4);
    border:2px solid rgba(255,255,255,.16);
    margin-bottom:-6px;              /* sobresale un poco: destaca sobre el fondo */
    animation:floatPoster 6s ease-in-out infinite;
  }
  .poster img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;background:var(--bg2);}
  .hero-meta{flex:1;min-width:0;padding-bottom:2px;overflow:hidden;}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .badge{
    font-size:9.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
    padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.1);
    border:1px solid var(--border);
  }
  .badge.accent{background:var(--accent);color:#fff;border-color:transparent;}
  .badge.hd{color:var(--accent-2);border-color:rgba(244,117,33,.5);}
  h1.title{
    font-size:20px;line-height:1.15;font-weight:800;margin-bottom:6px;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  .sub-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 9px;color:var(--muted);font-size:12px;font-weight:600;}
  .sub-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);}
  .rating{display:inline-flex;align-items:center;gap:3px;color:#ffd04a;}
  .rating svg{width:13px;height:13px;}

  /* ====== Content ====== */
  .content{
    position:relative;z-index:3;margin-top:-4px;
    padding:4px 16px 48px;max-width:720px;
  }

  /* CTA buttons */
  .cta-row{display:flex;gap:10px;margin:4px 0 16px;}
  .btn-play{
    position:relative;overflow:hidden;
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 18px;border-radius:13px;font-size:14.5px;font-weight:800;
    letter-spacing:.2px;color:#fff;
    /* NARANJA PREMIUM OSCURO: degradado naranja quemado con profundidad */
    background:linear-gradient(135deg,#e06a16 0%,#c9550a 48%,#a63f04 100%);
    border:1px solid rgba(255,150,80,.4);
    box-shadow:
      0 8px 22px rgba(140,55,0,.6),
      0 3px 8px rgba(90,35,0,.4),
      inset 0 1px 0 rgba(255,210,170,.3),
      inset 0 -2px 6px rgba(80,28,0,.5);
    text-shadow:0 1px 2px rgba(70,24,0,.6);
    transition:transform .18s, box-shadow .25s;
  }
  /* brillo superior "glossy" premium */
  .btn-play::before{
    content:"";position:absolute;left:0;right:0;top:0;height:50%;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));
    pointer-events:none;
  }
  /* destello blanco que recorre el botón */
  .btn-play::after{
    content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));
    transform:skewX(-20deg);
    animation:btnShine 4.5s ease-in-out infinite;
  }
  .btn-play span,.btn-play svg{position:relative;z-index:1;}
  .btn-play svg{width:19px;height:19px;}
  .btn-play:active{transform:scale(.96);box-shadow:0 4px 12px rgba(140,55,0,.5),inset 0 1px 0 rgba(255,210,170,.25);}
  @keyframes btnShine{
    0%{left:-60%;}
    55%{left:130%;}
    100%{left:130%;}
  }
  .btn-ghost{
    width:46px;height:46px;flex:0 0 auto;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--border);
    transition:transform .18s, background .2s, color .2s;
  }
  .btn-ghost:active{transform:scale(.9);}
  .btn-ghost.on{color:var(--accent);background:rgba(244,117,33,.14);border-color:rgba(244,117,33,.4);}
  .btn-ghost svg{width:21px;height:21px;}

  /* Genre chips (slider horizontal dentro del hero) */
  .chips{
    display:flex;gap:6px;margin-top:11px;padding-bottom:2px;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent 100%);
            mask-image:linear-gradient(90deg,#000 88%,transparent 100%);
  }
  /* espacio al final del slider para que el último no quede pegado al borde */
  .chips::after{content:"";flex:0 0 4px;}
  .chips::-webkit-scrollbar{height:0;}
  .chip{
    flex:0 0 auto;scroll-snap-align:start;
    font-size:11.5px;font-weight:600;line-height:1;padding:6px 12px;border-radius:999px;white-space:nowrap;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
    color:#f0f0f0;backdrop-filter:blur(4px);
    transition:transform .15s, background .2s;
  }
  .chip:active{transform:scale(.94);background:rgba(244,117,33,.3);}

  /* ====== TABS (línea inferior en la activa) ====== */
  .tabs{
    position:sticky;top:calc(env(safe-area-inset-top) + 48px);z-index:30;
    display:flex;margin:2px -16px 0;padding:0 16px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .tab{
    flex:1 1 0;position:relative;padding:11px 6px 10px;text-align:center;
    font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;
    background:none;border:none;
    transition:color .25s;
  }
  .tab::after{
    content:"";position:absolute;left:10px;right:10px;bottom:0;height:2.5px;
    border-radius:3px 3px 0 0;background:var(--accent);
    transform:scaleX(0);transform-origin:center;opacity:0;
    transition:transform .3s cubic-bezier(.22,.61,.36,1), opacity .25s;
  }
  .tab:active{color:#fff;}
  .tab.active{color:#fff;}
  .tab.active::after{transform:scaleX(1);opacity:1;}

  .tab-panel{padding-top:16px;animation:fadeIn .35s ease;}
  .tab-panel[hidden]{display:none;}

  /* Section */
  .section{margin-bottom:22px;}
  .tab-panel > .section:last-child{margin-bottom:0;}
  /* Separación de la sección Episodios (va tras los paneles) */
  #episodesSection{margin-top:26px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .section-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:14px;}
  .section-head .section-title{margin-bottom:0;}
  .section-title::before{content:"";width:3.5px;height:15px;border-radius:3px;background:var(--accent);}

  .synopsis{color:#cfcfcf;font-size:13.5px;line-height:1.6;}
  .synopsis.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
  .read-more{margin-top:7px;color:var(--accent);font-weight:700;font-size:13px;}

  /* Info grid */
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .info-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:11px 12px;transition:transform .2s, border-color .2s;
  }
  .info-card:active{transform:translateY(-2px);border-color:rgba(244,117,33,.4);}
  .info-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .info-value{font-size:13.5px;font-weight:700;}

  /* ====== Serie: controles (temporada <select> nativo + ordenar) ====== */
  .ep-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  #episodesSection .section-head{flex-wrap:wrap;}
  .native-season{
    position:relative;display:flex;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding-left:10px;transition:background .25s;
  }
  /* temporada activa → fondo destacado (el borde NO cambia al pulsar) */
  .native-season.active-season{
    background:rgba(244,117,33,.18);
    border-color:rgba(244,117,33,.45);
  }
  .native-season.active-season svg.lead,
  .native-season.active-season select{color:var(--accent);}
  .native-season svg.lead{width:17px;height:17px;color:#fff;pointer-events:none;}
  /* El <select> nativo: en Android/WebView abre el diálogo/lista nativo del sistema */
  .native-season select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    background:transparent;color:#fff;font-size:13px;font-weight:700;
    border:none;outline:none;padding:8px 28px 8px 7px;cursor:pointer;
    max-width:140px;text-overflow:ellipsis;
  }
  .native-season select option{color:#111;}
  .native-season svg.caret{
    position:absolute;right:9px;width:16px;height:16px;color:#fff;pointer-events:none;
  }
  /* Botón compacto de ordenar (solo icono); el <select> va encima
     transparente para que al tocarlo abra la ventana nativa de Android */
  .sort-pill{
    position:relative;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:10px;
    background:var(--card);border:1px solid var(--border);color:#fff;
    transition:transform .15s, border-color .2s;
  }
  .sort-pill:active{transform:scale(.93);}
  .sort-pill .sort-ic{width:18px;height:18px;pointer-events:none;}
  .sort-pill select{
    position:absolute;inset:0;width:100%;height:100%;
    opacity:0;border:none;background:transparent;cursor:pointer;
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
  }
  .sort-pill select option{color:#111;}

  /* ====== Lista de episodios (tarjetas) ====== */
  .ep-list{display:flex;flex-direction:column;gap:9px;}
  @keyframes epIn{
    from{opacity:0;transform:translateY(14px) scale(.985);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .ep-item{
    display:flex;gap:11px;padding:8px;border-radius:12px;
    background:var(--card);border:1px solid var(--border);cursor:pointer;
    opacity:0;animation:epIn .42s cubic-bezier(.22,.61,.36,1) both;
    transition:transform .18s, border-color .2s, background .2s;
  }
  .ep-item:active{transform:scale(.985);border-color:rgba(244,117,33,.45);background:#1f1f22;}
  .ep-thumb{
    position:relative;flex:0 0 112px;width:112px;height:66px;border-radius:9px;overflow:hidden;
    background:var(--bg2);
  }
  .ep-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
  .ep-item:active .ep-thumb img{transform:scale(1.07);}
  .ep-thumb .play-ov{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.25);
  }
  .ep-thumb .play-ov svg{width:26px;height:26px;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
  .ep-dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.75);font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:5px;}
  .ep-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .ep-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
  .ep-num{font-size:11px;font-weight:800;color:var(--accent);background:rgba(244,117,33,.14);padding:1px 7px;border-radius:6px;}
  .ep-title{font-size:13px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ep-desc{font-size:11.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* Fila inferior de la card: switch visto / no visto */
  .ep-watch{display:flex;align-items:center;gap:7px;margin-top:7px;}
  .ep-switch{
    position:relative;flex:0 0 auto;width:36px;height:20px;border-radius:999px;
    background:#3a3a3e;border:1px solid var(--border);transition:background .25s;
  }
  .ep-switch::after{
    content:"";position:absolute;top:1.5px;left:1.5px;width:15px;height:15px;border-radius:50%;
    background:#fff;transition:transform .25s cubic-bezier(.22,.61,.36,1);
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .ep-switch.on{background:var(--accent);border-color:transparent;}
  .ep-switch.on::after{transform:translateX(16px);}
  .ep-watch-label{font-size:11px;font-weight:700;color:var(--muted);transition:color .2s;}
  .ep-watch-label.on{color:var(--accent);}

  /* Estado "visto": card atenuada + miniatura marcada */
  .ep-item.watched{opacity:.62;}
  .ep-item.watched .ep-thumb::before{
    content:"";position:absolute;inset:0;z-index:1;background:rgba(244,117,33,.18);
  }
  .ep-check{
    position:absolute;left:5px;top:5px;z-index:2;width:18px;height:18px;border-radius:50%;
    background:var(--accent);display:none;align-items:center;justify-content:center;
  }
  .ep-check svg{width:12px;height:12px;fill:#fff;}
  .ep-item.watched .ep-check{display:flex;}

  /* Cast (slider horizontal) — respeta el padding lateral, no toca el borde */
  .cast-grid{
    display:flex;gap:14px;padding:2px 2px 4px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
  }
  .cast-grid::after{content:"";flex:0 0 2px;}
  .cast-grid::-webkit-scrollbar{height:0;}
  .cast-card{flex:0 0 64px;scroll-snap-align:start;text-align:center;}
  .cast-img{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--border);margin:0 auto 7px;}
  .cast-img img{width:100%;height:100%;object-fit:cover;}
  .cast-name{font-size:11px;font-weight:700;line-height:1.2;}
  .cast-role{font-size:10px;color:var(--muted);}

  /* Player modal */
  .player{
    position:fixed;inset:0;z-index:100;background:#000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .player.open{opacity:1;pointer-events:auto;}
  .player-close{
    position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:2;
    width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
  }
  .player-close svg{width:24px;height:24px;fill:#fff;}
  .player-box{width:100%;max-width:900px;aspect-ratio:16/9;background:#111;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted);}
  .player-box svg{width:64px;height:64px;fill:var(--accent);}

  /* ====== Bottom sheet "Mi lista" ====== */
  .sheet-backdrop{
    position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.6);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{
    width:100%;max-width:520px;
    background:#1b1b1f;border:1px solid var(--border);border-bottom:none;
    border-radius:20px 20px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);
    transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.61,.36,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.6);
  }
  .sheet-backdrop.open .sheet{transform:translateY(0);}
  .sheet-grip{width:40px;height:4px;border-radius:999px;background:#444;margin:4px auto 14px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .sheet-title{font-size:16px;font-weight:800;}
  .sheet-x{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#fff;}
  .sheet-x svg{width:20px;height:20px;}
  .sheet-sub{font-size:12.5px;color:var(--muted);margin:2px 0 14px;}
  .sheet-options{display:flex;flex-direction:column;gap:8px;}
  .list-opt{

<script>

/* ---- EJEMPLO PELÍCULA (copia esto sobre ANIME para probar el modo película) ----
const ANIME = {
  type: "pelicula",
  title: "Jujutsu Kaisen 0",
  year: 2021,
  rating: 7.9,
  status: "Estreno",
  studio: "MAPPA",
  duration: "1h 45m",
  audio: "Japonés · Latino",
  director: "Sunghoo Park",
  poster: "https://image.tmdb.org/t/p/w500/fHpKWq9ayzSk8nSwqRuaAUemRKh.jpg",
  backdrop: "https://image.tmdb.org/t/p/original/vIgyYkXkg6NC2whRbYjBD7eb3Er.jpg",
  badges: ["Película", "HD 1080p", "SUB · DOB", "16+"],
  genres: ["Acción", "Sobrenatural", "Fantasía"],
  synopsis: "Yuta Okkotsu es un adolescente atormentado por Rika, su amiga de la infancia convertida en una maldición...",
  cast: [ { name:"Yuta", role:"M. Ogata", img:"https://i.pravatar.cc/150?img=5" } ]
};
---------------------------------------------------------------------------------- */

/* ============================================================
   ESTADO
   ============================================================ */
const isMovie = ANIME.type === "pelicula";
let currentSeason = 0;
let sortAsc = true;

const $ = (id) => document.getElementById(id);

/* Póster/placeholder SVG embebido (data URI) — NO depende de internet,
   así SIEMPRE se ve un póster aunque no cargue la imagen remota.
   Genera una portada tipo anime con degradado naranja + título. */
function makePlaceholder(label){
  const raw = (label || "Anime").replace(/[<>&]/g,"").trim();
  // Partir el título en 2 líneas si es largo
  const words = raw.split(/\s+/);
  let l1 = "", l2 = "";
  for (const w of words){ if ((l1+" "+w).trim().length <= 12) l1 = (l1+" "+w).trim(); else l2 = (l2+" "+w).trim(); }
  l2 = l2.slice(0,14);
  const svg =
  `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450'>
     <defs>
       <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
         <stop offset='0' stop-color='#2a2118'/><stop offset='1' stop-color='#120d08'/>
       </linearGradient>
       <linearGradient id='o' x1='0' y1='0' x2='1' y2='1'>
         <stop offset='0' stop-color='#ffa24d'/><stop offset='1' stop-color='#e85d04'/>
       </linearGradient>
       <radialGradient id='glow' cx='50%' cy='38%' r='55%'>
         <stop offset='0' stop-color='#f47521' stop-opacity='.5'/><stop offset='1' stop-color='#f47521' stop-opacity='0'/>
       </radialGradient>
     </defs>
     <rect width='300' height='450' fill='url(#bg)'/>
     <rect width='300' height='450' fill='url(#glow)'/>
     <circle cx='150' cy='168' r='64' fill='url(#o)'/>
     <text x='150' y='196' font-size='78' text-anchor='middle' fill='#fff' font-family='Arial' font-weight='bold'>N</text>
     <text x='150' y='300' font-size='24' text-anchor='middle' fill='#fff' font-family='Arial' font-weight='bold'>${l1}</text>
     <text x='150' y='330' font-size='24' text-anchor='middle' fill='#fff' font-family='Arial' font-weight='bold'>${l2}</text>
     <rect x='110' y='352' width='80' height='4' rx='2' fill='#f47521'/>
   </svg>`;
  // base64 evita problemas de escape con '#' en los url(#id) de los gradientes
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}
const PLACEHOLDER = makePlaceholder("");

/* ============================================================
   RENDER BASE
   ============================================================ */
(function renderBase(){
  document.title = "NekoWolf — " + ANIME.title;

  // Póster: usa SVG embebido si no hay URL o si se indica "EMBED";
  // si hay URL pero falla al cargar, cae al embebido (con el título).
  const posterImg = $("posterImg");
  const posterFallback = makePlaceholder(ANIME.title);
  const useEmbedPoster = !ANIME.poster || ANIME.poster === "EMBED";
  posterImg.onerror = () => { posterImg.onerror = null; posterImg.src = posterFallback; };
  posterImg.src = useEmbedPoster ? posterFallback : ANIME.poster;

  // Backdrop: igual lógica; si falla, usa el póster embebido
  const useEmbedBackdrop = !ANIME.backdrop || ANIME.backdrop === "EMBED";
  if (useEmbedBackdrop){
    $("heroBg").style.backgroundImage = `url('${posterFallback}')`;
  }
  if (!useEmbedBackdrop){
    const bd = new Image();
    bd.onload  = () => { $("heroBg").style.backgroundImage = `url('${ANIME.backdrop}')`; };
    bd.onerror = () => { $("heroBg").style.backgroundImage = `url('${posterFallback}')`; };
    bd.src = ANIME.backdrop;
  }
  $("animeTitle").textContent = ANIME.title;
  $("metaRating").textContent = ANIME.rating;
  $("metaYear").textContent = ANIME.year;
  $("metaType").textContent = isMovie ? "Película" : "Serie TV";
  $("synopsis").textContent = ANIME.synopsis;
  $("metaExtra").textContent = isMovie ? ANIME.duration : (totalEpisodes() + " Episodios");

  $("badges").innerHTML = (ANIME.badges || []).map((b,i) => {
    const cls = i === 0 ? "badge accent" : (/HD|1080|720|4K/i.test(b) ? "badge hd" : "badge");
    return `<span class="${cls}">${b}</span>`;
  }).join("");

  $("genreChips").innerHTML =
    (ANIME.genres || []).map(g => `<span class="chip">${g}</span>`).join("");

  $("btnPlayLabel").textContent = isMovie ? "Reproducir película" : "Reproducir E1";

  $("castGrid").innerHTML = (ANIME.cast || []).map(p => `
    <div class="cast-card">
      <div class="cast-img"><img src="${p.img}" alt="${p.name}" onerror="this.onerror=null;this.src='${PLACEHOLDER}';" /></div>
      <div class="cast-name">${p.name}</div>
      <div class="cast-role">${p.role}</div>
    </div>`).join("");

  const info = [
    ["Estado", ANIME.status],
    ["Estudio", ANIME.studio],
    ["Duración", ANIME.duration],
    ["Audio", ANIME.audio],
    ["Director", ANIME.director],
    ["Año", ANIME.year]
  ].filter(([,v]) => v != null && v !== "");
  $("infoGrid").innerHTML = info.map(([l,v]) => `
    <div class="info-card"><div class="info-label">${l}</div><div class="info-value">${v}</div></div>`).join("");
})();

function totalEpisodes(){
  return (ANIME.seasons || []).reduce((s, t) => s + (t.episodes?.length || 0), 0);
}

/* ============================================================
   TABS
   ============================================================ */
(function buildTabs(){
  // Episodios ya NO es tab (va como sección aparte, debajo de todo)
  const tabsDef = [["sinopsis","Sinopsis"],["reparto","Reparto"],["info","Información"]];
  const ids = tabsDef.map(t => t[0]);
  let idx = 0;

  $("tabs").innerHTML = tabsDef
    .map((t,i) => `<button class="tab ${i===0?'active':''}" data-tab="${t[0]}">${t[1]}</button>`)
    .join("");

  function show(i, dir){
    if (i < 0 || i >= ids.length) return;
    idx = i;
    ids.forEach((p,j) => {
      const el = $("panel-"+p);
      if(!el) return;
      el.hidden = (j !== i);
      if (j === i && dir){
        // animación direccional al deslizar
        el.style.animation = "none";
        void el.offsetWidth; // reflow
        el.style.animation = (dir > 0 ? "panelInRight" : "panelInLeft") + " .28s ease";
      }
    });
    $("tabs").querySelectorAll(".tab").forEach((b,j) =>
      b.classList.toggle("active", j === i));
  }

  $("tabs").querySelectorAll(".tab").forEach((b,i) =>
    b.addEventListener("click", () => show(i, i > idx ? 1 : (i < idx ? -1 : 0))));

  /* ===== Gestos (swipe) para cambiar de tab ===== */
  // Zona sensible: paneles de tabs, PERO no sobre sliders horizontales
  // (reparto, géneros…) para no robarles su propio scroll.
  let sx = 0, sy = 0, tracking = false;
  function inTabArea(target){
    if (!target || !target.closest) return false;
    if (!target.closest(".tab-panel")) return false;
    // si el gesto empieza sobre un carrusel horizontal, lo dejamos a él
    if (target.closest(".cast-grid, .chips, .ep-scroll")) return false;
    return true;
  }
  function onStart(x, y, target){
    if (!inTabArea(target)) { tracking = false; return; }
    sx = x; sy = y; tracking = true;
  }
  function onEnd(x, y){
    if (!tracking) return;
    tracking = false;
    const dx = x - sx, dy = y - sy;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6){
      if (dx < 0) show(Math.min(idx + 1, ids.length - 1), 1);   // izquierda → siguiente
      else        show(Math.max(idx - 1, 0), -1);               // derecha → anterior
    }
  }
  document.addEventListener("touchstart", e => onStart(e.touches[0].clientX, e.touches[0].clientY, e.target), {passive:true});
  document.addEventListener("touchend",   e => onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY), {passive:true});
  // soporte ratón (para probar en escritorio)
  document.addEventListener("mousedown", e => onStart(e.clientX, e.clientY, e.target));
  document.addEventListener("mouseup",   e => onEnd(e.clientX, e.clientY));

  show(0);
})();

/* ============================================================
   Estado "visto" de episodios (persistente en localStorage)
   clave: "T{temporada}E{episodio}"
   ============================================================ */
const WATCH_KEY = "nekowolf_watched_" + (ANIME.title || "anime");
let watched = {};
try { watched = JSON.parse(localStorage.getItem(WATCH_KEY) || "{}"); } catch(e){ watched = {}; }
function epKey(s, n){ return "T" + s + "E" + n; }
function isWatched(s, n){ return !!watched[epKey(s, n)]; }
function setWatched(s, n, val){
  const k = epKey(s, n);
  if (val) watched[k] = 1; else delete watched[k];
  try { localStorage.setItem(WATCH_KEY, JSON.stringify(watched)); } catch(e){}
}

/* ============================================================
   MODO SERIE — temporadas (select nativo), ordenar, episodios
   ============================================================ */
if (!isMovie && ANIME.seasons && ANIME.seasons.length){
  $("episodesSection").hidden = false;   // mostrar la sección (abajo de todo)
  const seasonSelect = $("seasonSelect");
  const sortSelect   = $("sortSelect");
  const epList       = $("epList");

  // Poblamos el <select> nativo → solo el nombre (sin cantidad de episodios)
  seasonSelect.innerHTML = ANIME.seasons
    .map((t,i) => `<option value="${i}">${t.name}</option>`)
    .join("");
  seasonSelect.value = String(currentSeason);
  // marcar como "activa" el contenedor del selector de temporada
  $("seasonWrap").classList.add("active-season");
  seasonSelect.addEventListener("change", () => {
    currentSeason = +seasonSelect.value;
    renderEpisodes();
  });

  // Ordenar con ventana nativa (igual que temporadas)
  sortSelect.value = sortAsc ? "asc" : "desc";
  sortSelect.addEventListener("change", () => {
    sortAsc = sortSelect.value === "asc";
    renderEpisodes();
    toast(sortAsc ? "Orden: primero los antiguos" : "Orden: primero los recientes");
  });

  function renderEpisodes(){
    const eps = [...ANIME.seasons[currentSeason].episodes]
      .sort((a,b) => sortAsc ? a.n - b.n : b.n - a.n);
    epList.innerHTML = eps.map((ep,i) => {
      const seen = isWatched(currentSeason, ep.n);
      return `
      <div class="ep-item ${seen?'watched':''}" data-ep="${ep.n}" style="animation-delay:${i*45}ms">
        <div class="ep-thumb">
          <img src="${ep.thumb}" alt="EP ${ep.n}" onerror="this.onerror=null;this.src='${PLACEHOLDER}';" />
          <span class="ep-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
          <span class="ep-dur">${ep.dur}</span>
          <div class="play-ov"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        </div>
        <div class="ep-info">
          <div class="ep-top">
            <span class="ep-num">E${ep.n}</span>
            <span class="ep-title">${ep.title}</span>
          </div>
          <div class="ep-desc">${ep.desc || ""}</div>
          <div class="ep-watch" data-watch>
            <span class="ep-switch ${seen?'on':''}" role="switch" aria-checked="${seen}"></span>
            <span class="ep-watch-label ${seen?'on':''}">${seen ? "Visto" : "No visto"}</span>
          </div>
        </div>
      </div>`;
    }).join("");

    epList.querySelectorAll(".ep-item").forEach(card => {
      const n = +card.dataset.ep;
      const watchRow = card.querySelector("[data-watch]");
      const sw = card.querySelector(".ep-switch");
      const lbl = card.querySelector(".ep-watch-label");

      // Toggle visto / no visto (no abre el reproductor)
      watchRow.addEventListener("click", (e) => {
        e.stopPropagation();
        const nowSeen = !isWatched(currentSeason, n);
        setWatched(currentSeason, n, nowSeen);
        sw.classList.toggle("on", nowSeen);
        sw.setAttribute("aria-checked", String(nowSeen));
        lbl.classList.toggle("on", nowSeen);
        lbl.textContent = nowSeen ? "Visto" : "No visto";
        card.classList.toggle("watched", nowSeen);
        toast(nowSeen ? `E${n} marcado como visto` : `E${n} marcado como no visto`);
      });

      // Resto de la card → reproducir
      card.addEventListener("click", () =>
        openPlayer(`${ANIME.seasons[currentSeason].name} · Episodio ${n}`));
    });
  }
  renderEpisodes();

  $("btnPlay").addEventListener("click", () => {
    const first = [...ANIME.seasons[currentSeason].episodes].sort((a,b)=>a.n-b.n)[0];
    openPlayer(`${ANIME.seasons[currentSeason].name} · Episodio ${first ? first.n : 1}`);
  });
} else {
  $("btnPlay").addEventListener("click", () => openPlayer(ANIME.title));
}

/* ===== Leer más / menos ===== */
const syn = $("synopsis");
$("readMore").addEventListener("click", function(){
  const clamped = syn.classList.toggle("clamp");
  this.textContent = clamped ? "Leer más ▾" : "Leer menos ▴";
});

/* ============================================================
   MI LISTA — modal con estados del anime (persistente)
   ============================================================ */
const LIST_KEY = "nekowolf_list_" + (ANIME.title || "anime");
let myStatus = null;
try { myStatus = localStorage.getItem(LIST_KEY) || null; } catch(e){ myStatus = null; }

// Opciones de estado (puedes añadir/quitar aquí)
const LIST_OPTIONS = [
  { id:"viendo",     label:"Viendo",       sub:"Lo estás viendo ahora",  icon:"M8 5v14l11-7z" },
  { id:"completado", label:"Completado",   sub:"Ya lo terminaste",       icon:"M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" },
  { id:"pendiente",  label:"Planeo ver",   sub:"Para ver más tarde",     icon:"M12 2a10 10 0 100 20 10 10 0 000-20zm1 11h-2V7h2z M13 15h-2v2h2z" },
  { id:"espera",     label:"En espera",    sub:"Pausado por ahora",      icon:"M6 5h4v14H6zm8 0h4v14h-4z" },
  { id:"abandonado", label:"Abandonado",   sub:"Dejaste de verlo",       icon:"M12 2a10 10 0 100 20 10 10 0 000-20zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12z" }
];

const btnFav     = $("btnFav");
const listSheet  = $("listSheet");
const listBox    = $("listSheetBox");
const listOptions= $("listOptions");
const listRemove = $("listRemove");

function statusLabel(id){ const o = LIST_OPTIONS.find(x=>x.id===id); return o ? o.label : null; }

function renderListOptions(){
  listOptions.innerHTML = LIST_OPTIONS.map(o => `
    <button class="list-opt ${myStatus===o.id?'selected':''}" data-id="${o.id}">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="${o.icon}"/></svg></span>
      <span class="txt"><b>${o.label}</b><small>${o.sub}</small></span>
      <span class="tick"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
    </button>`).join("");
  listRemove.hidden = !myStatus;

  listOptions.querySelectorAll(".list-opt").forEach(btn =>
    btn.addEventListener("click", () => {
      myStatus = btn.dataset.id;
      try { localStorage.setItem(LIST_KEY, myStatus); } catch(e){}
      updateFavUI();
      renderListOptions();
      toast("Guardado en Mi lista: " + statusLabel(myStatus));
      setTimeout(closeListSheet, 250);
    }));
}

function updateFavUI(){
  btnFav.classList.toggle("on", !!myStatus);
  btnFav.title = myStatus ? ("Mi lista · " + statusLabel(myStatus)) : "Mi lista";
}

function openListSheet(){
  renderListOptions();
  listSheet.classList.add("open");
  lockScroll(true);
}
function closeListSheet(){
  listSheet.classList.remove("open");
  lockScroll(false);
}

/* Bloquea/restaura el scroll del fondo cuando hay un modal abierto */
let _scrollY = 0;
function lockScroll(lock){
  if (lock){
    _scrollY = window.scrollY;
    document.body.style.position = "fixed";
    document.body.style.top = `-${_scrollY}px`;
    document.body.style.left = "0";
    document.body.style.right = "0";
    document.body.style.width = "100%";
    document.body.style.overflow = "hidden";
  } else {
    document.body.style.position = "";
    document.body.style.top = "";
    document.body.style.left = "";
    document.body.style.right = "";
    document.body.style.width = "";
    document.body.style.overflow = "";
    window.scrollTo(0, _scrollY);
  }
}

btnFav.addEventListener("click", openListSheet);
$("listSheetClose").addEventListener("click", closeListSheet);
listSheet.addEventListener("click", (e) => { if (e.target === listSheet) closeListSheet(); });
listBox.addEventListener("click", (e) => e.stopPropagation());
listRemove.addEventListener("click", () => {
  myStatus = null;
  try { localStorage.removeItem(LIST_KEY); } catch(e){}
  updateFavUI();
  renderListOptions();
  toast("Quitado de Mi lista");
  setTimeout(closeListSheet, 200);
});
updateFavUI();

/* ============================================================
   FAVORITO (corazón sobre el fondo) — persistente
   ============================================================ */
const FAV_KEY = "nekowolf_fav_" + (ANIME.title || "anime");
const btnHeroFav = $("btnHeroFav");
const heroFavIcon = $("heroFavIcon");
// Corazón contorno (no favorito) vs relleno (favorito)
const HEART_OUTLINE = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35zM12 18.5l.1-.09C16.81 14.08 20 11.19 20 8.5 20 6.5 18.5 5 16.5 5c-1.54 0-3.04.99-3.57 2.36h-1.87C10.54 5.99 9.04 5 7.5 5 5.5 5 4 6.5 4 8.5c0 2.69 3.19 5.58 7.9 9.91l.1.09z";
const HEART_FILLED = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
let isFav = false;
try { isFav = localStorage.getItem(FAV_KEY) === "1"; } catch(e){ isFav = false; }
function renderFav(){
  btnHeroFav.classList.toggle("on", isFav);
  btnHeroFav.setAttribute("aria-pressed", String(isFav));
  heroFavIcon.innerHTML = `<path d="${isFav ? HEART_FILLED : HEART_OUTLINE}"/>`;
}
renderFav();
btnHeroFav.addEventListener("click", () => {
  isFav = !isFav;
  try { isFav ? localStorage.setItem(FAV_KEY,"1") : localStorage.removeItem(FAV_KEY); } catch(e){}
  renderFav();
  toast(isFav ? "Añadido a Favoritos" : "Quitado de Favoritos");
});

/* ===== Reproductor ===== */
const player = $("player");
function openPlayer(label){
  $("playerLabel").textContent = "Reproduciendo: " + label;
  player.classList.add("open");
  lockScroll(true);
}
$("playerClose").addEventListener("click", () => {
  player.classList.remove("open");
  lockScroll(false);
});

/* ===== Scroll: topbar sólida + PARALLAX del fondo ===== */
const topbar = $("topbar");
const heroWrap = $("heroWrap");
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  topbar.classList.toggle("solid", y > 60);
  // Parallax: el fondo se mueve más lento que el scroll
  heroWrap.style.transform = `translate3d(0, ${y * 0.35}px, 0)`;
}, { passive:true });

/* ===== Toast ===== */
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

/* ===== Failsafe: si alguna animación .reveal no dispara (ciertos WebView),
   forzamos visibilidad para que el póster y la info NUNCA queden invisibles. */
setTimeout(() => {
  document.querySelectorAll(".reveal").forEach(el => { el.style.opacity = "1"; });
}, 1200);
</script>
