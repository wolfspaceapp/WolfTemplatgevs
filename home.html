<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>NekoWolf — Inicio</title>
<style>
  :root{
    --accent:#f47521; --accent-2:#ff9a52; --accent-rgb:244, 117, 33;
    --grad:linear-gradient(135deg,#ffa24d 0%,#f47521 48%,#e8630e 100%);
    --bg:#0a0a0a; --bg2:#141414; --card:#1a1a1a;
    --text:#ffffff; --muted:#9b9b9b; --border:rgba(255,255,255,.08);
    --nav-h:62px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--bg);color:var(--text);overflow-x:hidden;position:fixed;inset:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  svg{fill:currentColor;}
  a{color:inherit;text-decoration:none;}
  .hidden{display:none !important;}

  /* ===== Keyframes ===== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slowZoom{from{transform:scale(1.12);}to{transform:scale(1);}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.5);}50%{box-shadow:0 0 0 12px rgba(var(--accent-rgb),0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .reveal{opacity:0;animation:fadeUp .6s cubic-bezier(.22,.61,.36,1) forwards;}

  /* ===== Top bar ===== */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background:linear-gradient(180deg,rgba(10,10,10,.95),rgba(10,10,10,0));transition:background .35s;}
  .topbar.solid{background:rgba(10,10,10,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .brand-logo{height:34px;width:auto;object-fit:contain;display:block;
    filter:drop-shadow(0 0 8px rgba(var(--accent-rgb),.45));}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;}
  .brand b{font-size:17px;font-weight:800;letter-spacing:.3px;}
  .brand b span{color:var(--accent);}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .2s,background .2s;}
  .icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.12);}
  .icon-btn svg{width:23px;height:23px;}

  /* ===== Scroll container ===== */
  main{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  main::-webkit-scrollbar{width:0;}
  /* espacio al final para que la navbar flotante no tape el contenido */
  .rows{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px) !important;}

  /* ===== Hero destacado (compacto) ===== */
  .hero{position:relative;height:62vh;min-height:400px;max-height:540px;overflow:hidden;}
  .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none;}
  .hero-slide.on{opacity:1;pointer-events:auto;}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;}
  /* overlay más limpio y cinematográfico */
  .hero-bg::after{content:"";position:absolute;inset:0;
    background:
      linear-gradient(0deg,var(--bg) 2%,rgba(10,10,10,.7) 24%,rgba(10,10,10,.1) 55%,rgba(10,10,10,.5) 100%);}
  .hero-content{position:absolute;left:0;right:0;bottom:18px;padding:0 18px;z-index:2;text-align:center;}

  .hero-tag{display:inline-flex;align-items:center;gap:5px;margin:0 auto 11px;
    font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--accent-2);
    padding:5px 12px;border-radius:999px;background:rgba(var(--accent-rgb),.14);
    border:1px solid rgba(var(--accent-rgb),.4);}
  .hero-tag svg{width:13px;height:13px;fill:var(--accent-2);}

  .hero-logo{font-size:30px;font-weight:900;line-height:1.05;margin-bottom:11px;
    text-shadow:0 3px 18px rgba(0,0,0,.8);letter-spacing:-.5px;}

  .hero-genres{display:flex;justify-content:center;flex-wrap:wrap;gap:0;margin-bottom:14px;color:#cfcfcf;font-size:11.5px;font-weight:600;}
  .hero-genres span{position:relative;padding:0 9px;}
  .hero-genres span+span::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent);}

  .hero-meta{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:5px 9px;color:#dcdcdc;font-size:11.5px;font-weight:700;margin-bottom:16px;}
  .hero-meta .rate{display:inline-flex;align-items:center;gap:3px;color:#ffd04a;}
  .hero-meta .rate svg{width:13px;height:13px;fill:#ffd04a;}
  .hero-meta .tag-hd{color:var(--accent-2);border:1px solid rgba(var(--accent-rgb),.5);padding:1px 6px;border-radius:5px;font-size:9.5px;font-weight:800;}
  .hero-meta .dot{width:3px;height:3px;border-radius:50%;background:#777;}

  .hero-actions{display:flex;gap:9px;max-width:420px;margin:0 auto;}
  .btn-play{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:14px;
    font-size:14.5px;font-weight:800;color:#fff;background:var(--grad);
    box-shadow:0 10px 24px -4px rgba(var(--accent-rgb),.6),inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .18s;}
  .btn-play:active{transform:scale(.97);}
  .btn-play svg{width:18px;height:18px;}
  .btn-round{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:50px;height:50px;border-radius:14px;color:#fff;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);transition:transform .18s,background .2s;}
  .btn-round:active{transform:scale(.92);}
  .btn-round svg{width:22px;height:22px;}
  .btn-round span{display:none;}

  /* dots DENTRO del hero, arriba-derecha, estilo moderno */
  .hero-dots{position:absolute;top:calc(env(safe-area-inset-top) + 56px);right:16px;z-index:3;display:flex;flex-direction:column;gap:6px;}
  .hero-dots span{width:4px;height:4px;border-radius:999px;background:rgba(255,255,255,.4);cursor:pointer;transition:height .35s,background .35s;}
  .hero-dots span.on{height:16px;background:var(--grad);box-shadow:0 0 8px rgba(var(--accent-rgb),.6);}

  /* ===== Filas / carruseles (compacto) ===== */
  .rows{padding:10px 0 20px;}
  .row{margin-bottom:18px;}
  .row-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-bottom:9px;}
  .row-title{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px;}
  .row-title::before{content:"";width:3.5px;height:15px;border-radius:3px;background:var(--accent);}
  .row-more{font-size:11.5px;font-weight:700;color:var(--muted);}
  .row-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scroll-snap-type:x proximity;overscroll-behavior-x:contain;}
  .row-scroll::-webkit-scrollbar{height:0;}
  .row-scroll::after{content:"";flex:0 0 10px;}
  /* espacio inferior extra en las filas de Explorar (sobre la navbar) */
  #exploreRows{padding-bottom:16px;}

  /* Card poster (compacta) */
  .card{flex:0 0 104px;scroll-snap-align:start;cursor:pointer;transition:transform .22s;}
  .card:active{transform:scale(.95);}
  .card .poster{
    position:relative;width:104px;height:152px;border-radius:13px;overflow:hidden;background:var(--bg2);
    box-shadow:0 8px 18px -8px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    transition:box-shadow .3s, transform .3s;
  }
  .card:active .poster{box-shadow:0 14px 30px -6px rgba(var(--accent-rgb),.5), 0 0 0 1px rgba(var(--accent-rgb),.5);}
  .card .poster img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,.61,.36,1);}
  .card:active .poster img{transform:scale(1.08);}
  /* degradado inferior para legibilidad del rating/tipo */
  .card .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 28%,transparent 58%,rgba(0,0,0,.72) 100%);}
  .card .badge{position:absolute;left:6px;top:6px;z-index:2;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
    padding:3px 7px;border-radius:999px;background:rgba(12,12,14,.55);border:1px solid rgba(255,255,255,.16);}
  .card .badge.new{background:var(--grad);border-color:transparent;box-shadow:0 2px 8px rgba(var(--accent-rgb),.5);}
  .card .crate{position:absolute;left:7px;bottom:7px;z-index:2;display:flex;align-items:center;gap:2px;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .card .crate svg{width:11px;height:11px;fill:#ffd04a;}
  .card .ctype{position:absolute;right:6px;bottom:7px;z-index:2;font-size:8.5px;font-weight:700;color:#eee;
    padding:2px 6px;border-radius:6px;background:rgba(12,12,14,.6);}
  .card .ctitle{font-size:12px;font-weight:700;margin-top:7px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .csub{font-size:10px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:4px;}
  .card .csub .lang{color:var(--accent-2);font-weight:700;}

  /* ===== Card de capítulo (episodios nuevos) — moderna ===== */
  .card-wide{flex:0 0 184px;scroll-snap-align:start;cursor:pointer;transition:transform .2s;}
  .card-wide:active{transform:scale(.96);}
  .card-wide .thumb{position:relative;width:184px;height:104px;border-radius:12px;overflow:hidden;background:var(--bg2);box-shadow:0 8px 18px -8px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);}
  .card-wide .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
  .card-wide:active .thumb img{transform:scale(1.07);}
  .card-wide .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.6));}
  /* chip de nº de episodio arriba-izquierda */
  .card-wide .epchip{position:absolute;left:8px;top:8px;z-index:2;font-size:9.5px;font-weight:800;color:#fff;
    padding:3px 8px;border-radius:7px;background:rgba(12,12,14,.6);border:1px solid rgba(255,255,255,.14);}
  /* idioma abajo-izquierda */
  .card-wide .eplang{position:absolute;left:8px;bottom:8px;z-index:2;font-size:9px;font-weight:800;letter-spacing:.3px;color:var(--accent-2);}
  .card-wide .ctitle{font-size:12px;font-weight:700;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-wide .csub{font-size:10.5px;color:var(--muted);margin-top:1px;}

  /* ===== Top 10 — rediseño pro ===== */
  .top10 .row-scroll{gap:6px;padding:4px 16px 4px;align-items:flex-start;}
  .top10-card{flex:0 0 auto;scroll-snap-align:start;cursor:pointer;transition:transform .2s;
    display:flex;align-items:flex-end;gap:2px;}
  .top10-card:active{transform:scale(.96);}
  /* número grande alineado al pie del póster, sin solaparse */
  .top10-num{flex:0 0 auto;font-size:80px;font-weight:900;line-height:.72;letter-spacing:-6px;
    color:transparent;-webkit-text-stroke:2px var(--accent);
    filter:drop-shadow(0 4px 10px rgba(var(--accent-rgb),.35));
    padding-bottom:2px;}
  .top10-card:first-child{padding-left:4px;}
  .top10-pic{flex:0 0 auto;}
  .top10-pic .poster{position:relative;width:100px;height:146px;border-radius:13px;overflow:hidden;background:var(--bg2);
    box-shadow:0 10px 22px -8px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08);}
  .top10-pic .poster img{width:100%;height:100%;object-fit:cover;}
  .top10-pic .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(0,0,0,.7));}
  .top10-pic .trate{position:absolute;right:7px;bottom:7px;z-index:2;display:flex;align-items:center;gap:2px;font-size:10px;font-weight:800;color:#fff;}
  .top10-pic .trate svg{width:11px;height:11px;fill:#ffd04a;}
  .top10-pic .tname{font-size:11.5px;font-weight:700;margin-top:7px;line-height:1.2;width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ===== Vistas (Explorar / Mi lista / Cuenta) ===== */
  .view{animation:fadeIn .3s ease;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);}
  #view-home{padding-bottom:0;}
  .view.hidden{display:none;}
  .view-title{font-size:19px;font-weight:900;letter-spacing:-.3px;padding:calc(env(safe-area-inset-top) + 64px) 16px 2px;}
  .view-title + *{margin-top:12px;}
  #view-explore .view-title:not(:first-child){padding-top:20px;}
  /* Mi lista: sin topbar, cabecera propia más arriba */
  #view-list .view-title{padding-top:calc(env(safe-area-inset-top) + 20px);font-size:24px;}

  /* Explorar: barra de búsqueda destacada */
  /* Explorar: header propio */
  .ex-header{padding:calc(env(safe-area-inset-top) + 18px) 16px 6px;}
  .ex-title{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:12px;}
  .explore-search{display:flex;align-items:center;gap:10px;width:100%;
    padding:14px 16px;border-radius:15px;background:var(--card);border:1px solid var(--border);color:var(--muted);
    font-size:14px;font-weight:600;transition:border-color .2s,transform .15s,box-shadow .2s;}
  .explore-search:active{transform:scale(.99);}
  .explore-search svg{width:20px;height:20px;fill:var(--accent);flex:0 0 auto;}
  .explore-sub{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;padding:20px 16px 11px;}

  /* Explorar: cuadrícula de géneros con imagen + tinte de color */
  .genre-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:0 16px;}
  .genre-cell{position:relative;height:92px;border-radius:16px;overflow:hidden;cursor:pointer;
    display:flex;align-items:center;padding:0 14px;transition:transform .18s;box-shadow:0 8px 18px -10px rgba(0,0,0,.7);}
  .genre-cell:active{transform:scale(.95);}
  .genre-cell .gimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.5;transform:scale(1);transition:transform .4s;}
  .genre-cell:active .gimg{transform:scale(1.08);}
  /* overlay con tinte de color único por celda (set vía --c) */
  .genre-cell::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--c,rgba(var(--accent-rgb),.85)) 0%,rgba(10,10,12,.6) 75%);}
  .genre-cell .gname{position:relative;z-index:1;font-size:15px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.7);}
  .genre-cell .garrow{position:absolute;right:12px;bottom:12px;z-index:1;width:18px;height:18px;opacity:.8;}
  .genre-cell .garrow svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5;}

  /* Noticias */
  .news-header{padding:calc(env(safe-area-inset-top) + 20px) 16px 6px;}
  .news-title{font-size:26px;font-weight:900;letter-spacing:-.5px;}
  .news-list{display:flex;flex-direction:column;gap:14px;padding:14px 16px;}
  /* primera noticia: destacada grande */
  .news-card{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:transform .15s,border-color .2s;}
  .news-card:active{transform:scale(.98);border-color:rgba(var(--accent-rgb),.5);}
  .news-feat{position:relative;}
  .news-feat .cover{width:100%;height:170px;object-fit:cover;display:block;background:var(--bg2);}
  .news-feat .cover-ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(5,5,8,.92));}
  .news-feat .cont{position:absolute;left:0;right:0;bottom:0;padding:14px;}
  .news-cat{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;
    background:var(--grad);padding:3px 9px;border-radius:999px;margin-bottom:8px;}
  .news-feat .h{font-size:17px;font-weight:800;line-height:1.25;text-shadow:0 2px 10px rgba(0,0,0,.8);}
  .news-feat .d{font-size:11.5px;color:#bbb;margin-top:6px;}
  /* noticias normales: fila horizontal */
  .news-row{display:flex;gap:12px;align-items:center;padding:11px;}
  .news-row .thumb{width:84px;height:62px;border-radius:11px;overflow:hidden;background:var(--bg2);flex:0 0 auto;}
  .news-row .thumb img{width:100%;height:100%;object-fit:cover;}
  .news-row .info{flex:1;min-width:0;}
  .news-row .cat{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);}
  .news-row .h{font-size:13.5px;font-weight:700;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .news-row .d{font-size:10.5px;color:var(--muted);margin-top:4px;}

  /* Mi lista: tabs + cuadrícula */
  .list-tabs{display:flex;gap:8px;padding:0 16px;overflow-x:auto;}
  .list-tabs::-webkit-scrollbar{height:0;}
  .list-tab{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--muted);padding:8px 15px;border-radius:999px;background:var(--card);border:1px solid var(--border);transition:.2s;}
  .list-tab.on{color:#fff;background:var(--grad);border-color:transparent;}
  .list-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;padding:16px;}
  .list-grid .card{flex:none;width:100%;}
  .list-grid .card .poster{width:100%;height:auto;aspect-ratio:2/3;}
  .lstatus{display:inline-block;font-size:9px;font-weight:800;color:var(--accent);background:rgba(var(--accent-rgb),.14);
    padding:2px 7px;border-radius:6px;margin-left:auto;}
  .lstatus.fav{color:#ff6b7a;background:rgba(255,107,122,.16);}
  .empty{text-align:center;color:var(--muted);padding:60px 24px;}
  .empty .ic{font-size:46px;margin-bottom:12px;}
  .empty .big{font-size:16px;font-weight:800;color:#fff;margin-bottom:6px;}
  @media(max-width:360px){.list-grid{grid-template-columns:repeat(2,1fr);}}

  /* Cuenta */
  .account{padding:calc(env(safe-area-inset-top) + 24px) 16px 20px;}
  .acc-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .acc-avatar{width:60px;height:60px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;box-shadow:0 8px 20px rgba(var(--accent-rgb),.4);}
  .acc-head .n{font-size:18px;font-weight:800;}
  .acc-head .e{font-size:12.5px;color:var(--muted);}
  .acc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
  .acc-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;}
  .acc-stat b{display:block;font-size:20px;font-weight:900;color:var(--accent);}
  .acc-stat small{font-size:11px;color:var(--muted);font-weight:700;}
  .acc-list{display:flex;flex-direction:column;gap:2px;}
  .acc-row{display:flex;align-items:center;gap:13px;padding:14px 12px;border-radius:12px;transition:background .2s;cursor:pointer;}
  .acc-row:active{background:var(--card);}
  .acc-row .ic{width:38px;height:38px;border-radius:11px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto;}
  .acc-row .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .acc-row .lbl{flex:1;font-size:14.5px;font-weight:700;}
  .acc-row .arr{color:var(--muted);}
  .acc-row .arr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ===== NAVBAR PEGADA ABAJO — moderna con indicador superior ===== */
  @keyframes navPop{0%{transform:scale(.8);}60%{transform:scale(1.1);}100%{transform:scale(1);}}
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding:0 6px env(safe-area-inset-bottom);
    display:flex;align-items:stretch;
    background:rgba(12,12,14,.92);
    -webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);
    border-top:1px solid var(--border);
  }
  .nav-item{
    flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--muted);transition:color .3s;
  }
  /* indicador superior: línea/punto que marca el activo */
  .nav-item::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);
    width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--grad);
    box-shadow:0 2px 10px rgba(var(--accent-rgb),.6);
    transition:transform .3s cubic-bezier(.22,.61,.36,1);
  }
  .nav-item svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s, stroke .3s, fill .3s;}
  .nav-item span{font-size:10.5px;font-weight:700;letter-spacing:.2px;transition:color .3s;}
  .nav-item:not(.active):active svg{transform:scale(.86);}

  /* ACTIVO: indicador visible + icono relleno suave + color de acento */
  .nav-item.active{color:var(--accent);}
  .nav-item.active::before{transform:translateX(-50%) scaleX(1);}
  .nav-item.active svg{stroke:var(--accent);fill:rgba(var(--accent-rgb),.16);animation:navPop .4s ease;}
  .nav-item.active span{color:var(--accent);}

  /* ===== Ver todo (overlay cuadrícula) ===== */
  .row-more:active{opacity:.6;}
  .allview{position:fixed;inset:0;z-index:60;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;}
  .allview.open{transform:translateX(0);}
  .allbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;border-bottom:1px solid var(--border);}
  .allbar b{font-size:16px;font-weight:800;}
  .allgrid{flex:1;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:16px 14px calc(var(--nav-h) + 20px);}
  .allgrid .card{flex:none;width:100%;}
  .allgrid .card .poster{width:100%;height:auto;aspect-ratio:2/3;}
  @media(max-width:360px){.allgrid{grid-template-columns:repeat(2,1fr);}}

  /* ===== Buscador overlay ===== */
  @keyframes srIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .search{position:fixed;inset:0;z-index:60;background:var(--bg);
    opacity:0;pointer-events:none;transform:scale(1.04);transform-origin:top right;
    transition:opacity .3s ease, transform .3s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;}
  .search.open{opacity:1;pointer-events:auto;transform:scale(1);}
  .search-bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 14px 14px;}
  /* campo con icono de lupa dentro */
  .search-field{flex:1;position:relative;display:flex;align-items:center;}
  .search-field .mag{position:absolute;left:13px;width:19px;height:19px;fill:var(--muted);pointer-events:none;transition:fill .2s;}
  .search-field:focus-within .mag{fill:var(--accent);}
  .search-bar input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:13px;color:#fff;font:inherit;font-size:15px;padding:13px 14px 13px 40px;outline:none;transition:border-color .25s, box-shadow .25s;}
  .search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.14);}
  .search-results{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 10px 20px;}
  .sr-item{display:flex;gap:13px;align-items:center;padding:9px;border-radius:14px;cursor:pointer;animation:srIn .3s ease both;transition:background .2s;}
  .sr-item:active{background:var(--card);}
  .sr-item .poster{width:50px;height:74px;border-radius:9px;overflow:hidden;background:var(--bg2);flex:0 0 auto;box-shadow:0 6px 14px -6px rgba(0,0,0,.7);}
  .sr-item .poster img{width:100%;height:100%;object-fit:cover;}
  .sr-item .t{font-size:14.5px;font-weight:700;}
  .sr-item .s{font-size:12px;color:var(--muted);margin-top:2px;}
  .sr-item .srate{display:inline-flex;align-items:center;gap:3px;color:#ffd04a;font-weight:800;margin-left:6px;}
  .sr-item .srate svg{width:11px;height:11px;fill:#ffd04a;}
  .search-empty{text-align:center;color:var(--muted);padding:60px 24px;animation:fadeIn .3s;}
  .search-empty .ic{font-size:44px;margin-bottom:12px;opacity:.8;}
  .search-empty .big{font-size:16px;font-weight:800;color:#fff;margin-bottom:4px;}

  @media(min-width:680px){
    .card,.card .poster{flex-basis:140px;width:140px;}
    .card .poster{height:205px;}
    .hero-logo{font-size:40px;}
  }
</style>
</head>

<!-- Opcional: reutiliza BLOG_URL/MAX_RESULTS de config.js si existe.
     Si no usas config.js, puedes borrar esta línea y poner BLOG.URL abajo. -->
<script src="config.js" onerror="window.__noConfig=1"></script>
<script>
/* ============================================================
   CONFIGURACION DE TEMA (HOME) — cambia los colores de la interfaz
   ------------------------------------------------------------
   Aplica la paleta a toda la pantalla (acento, degradados, chips,
   navbar, etc.) SIN tocar el negro del fondo.
   Paleta actual: CyberKai (azul neon + violeta suave).
   ============================================================ */
const THEME = {
  accent:   "#00F0FF",   // azul neon cibernetico (acento principal)
  accent2:  "#9B6DFF",   // violeta suave (secundario/brillos)
  // Degradado: azul neon -> violeta suave
  gradCustom:"linear-gradient(135deg,#00F0FF 0%,#5AA8FF 50%,#9B6DFF 100%)",
  gradAngle:"135deg"
  // NOTA: el fondo negro NO se cambia.
};
(function(){
  var r=document.documentElement.style;
  r.setProperty("--accent",THEME.accent);
  r.setProperty("--accent-2",THEME.accent2);
  r.setProperty("--grad",THEME.gradCustom);
  var m=THEME.accent.replace("#","").match(/^(..)(..)(..)$/);
  if(m) r.setProperty("--accent-rgb",parseInt(m[1],16)+", "+parseInt(m[2],16)+", "+parseInt(m[3],16));
})();

/* ============================================================
   CONFIGURACION DE BLOGGER — alimenta el home desde el feed
   ------------------------------------------------------------
   Pon el dominio de tu blog (sin barra final). Cada ENTRADA = un anime.
   Si lo dejas vacío o de ejemplo, se usan los datos DEMO de abajo.
   ============================================================ */
const BLOG = {
  // Si lo dejas vacío, se intenta leer BLOG_URL de config.js (window.APP_CONFIG).
  URL: (window.APP_CONFIG && window.APP_CONFIG.BLOG_URL) || "",   // ej: "https://tublog.blogspot.com"
  MAX: (window.APP_CONFIG && window.APP_CONFIG.MAX_RESULTS) || 150, // cuántos posts pedir
  GENRES: ["Acción","Comedia","Drama","Romance","Fantasía","Shounen","Terror","Ciencia Ficción","Aventura","Sobrenatural"],
  NUEVO_LABEL: "Nuevo",            // etiqueta que marca "nuevo episodio"
  MOVIE_WORDS: ["pelicula","película","movie","film"],
  DUB_WORDS: ["dob","doblaje","latino","dub"],
  SUB_WORDS: ["sub","subtitulado"]
};

/* ============================================================
   DATOS — se llenan 100% desde el feed de Blogger (ver BLOG.URL).
   ============================================================ */
let DATA = [];   // vacío hasta que carga el feed

const FALL = makePH("NekoWolf");
function makePH(label){
  const t=(label||"").slice(0,16);
  const AC=(THEME&&THEME.accent)||"#00F0FF";
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#1a1a22'/><stop offset='1' stop-color='#0a0a10'/></linearGradient></defs><rect width='300' height='450' fill='url(#g)'/><circle cx='150' cy='175' r='54' fill='"+AC+"'/><text x='150' y='198' font-size='64' text-anchor='middle' fill='#050508' font-family='Arial' font-weight='bold'>N</text><text x='150' y='300' font-size='20' text-anchor='middle' fill='#ccc' font-family='Arial'>"+t+"</text></svg>";
  return "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
}
function img(u){ return u || FALL; }

/* Filas de la home (por géneros/propiedades) */
const ROWS = [
  { title:"Los imperdibles de hoy", filter:d=>true, variant:"big" },
  { title:"Episodios nuevos",       filter:d=>d.nuevo, variant:"wide" },
  { title:"Películas destacadas",   filter:d=>d.type==="pelicula" },
  { title:"Acción",                 filter:d=>d.genres.includes("Acción") },
  { title:"Fantasía & Aventura",    filter:d=>d.genres.includes("Fantasía")||d.genres.includes("Aventura") }
];

/* ============================================================
   RENDER
   ============================================================ */
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ----- HERO rotatorio ----- */
let heroItems = DATA.slice(0,5), heroIdx=0, heroTimer=null;
function heroSlide(it,on,rank){
  const genres = (it.genres||[]).slice(0,3).map(g=>`<span>${esc(g)}</span>`).join("");
  const meta = [
    `<span class="rate"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${it.rating}</span>`,
    `<span class="dot"></span><span>${it.year}</span>`,
    `<span class="dot"></span><span>${it.type==="pelicula"?"Película":it.eps+" eps"}</span>`,
    `<span class="tag-hd">HD</span>`
  ].join(" ");
  return `<div class="hero-slide ${on?'on':''}" data-id="${esc(it.id)}">
    <div class="hero-bg" style="background-image:url('${img(it.backdrop)}')"></div>
    <div class="hero-content">
      <div class="hero-tag"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3L22 9l-5 4.9L18.2 21 12 17.6 5.8 21 7 13.9 2 9l7.1-.7z"/></svg>${rank?("#"+rank+" en tendencias"):"<b>Destacado</b>"}</div>
      <div class="hero-logo">${esc(it.title)}</div>
      <div class="hero-genres">${genres}</div>
      <div class="hero-meta">${meta}</div>
      <div class="hero-actions">
        <button class="btn-play" data-play><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Reproducir</button>
        <button class="btn-round" data-info aria-label="Mi lista"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg><span>Mi lista</span></button>
      </div>
    </div>
  </div>`;
}
function renderHero(){
  const h=document.getElementById("hero");
  h.innerHTML = heroItems.map((it,i)=>heroSlide(it,i===0,i+1)).join("")
    + `<div class="hero-dots">${heroItems.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join("")}</div>`;
  bindHero();
  startHero();
}
function bindHero(){
  const h=document.getElementById("hero");
  h.querySelectorAll(".hero-slide").forEach(s=>{
    const it=DATA.find(x=>x.id===s.dataset.id);
    s.querySelector("[data-play]").addEventListener("click",e=>{e.stopPropagation();go(it);});
    s.querySelector("[data-info]").addEventListener("click",e=>{e.stopPropagation();go(it);});
    s.querySelector(".hero-bg").addEventListener("click",()=>go(it));
  });
  // dots clicables (indicador)
  h.querySelectorAll(".hero-dots span").forEach((d,i)=>{
    d.addEventListener("click",()=>{ showHero(i); startHero(); });
  });
  // swipe horizontal para cambiar de slide destacado
  let sx=0,sy=0,tracking=false;
  h.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;},{passive:true});
  h.addEventListener("touchend",e=>{
    if(!tracking)return;tracking=false;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.5){
      showHero(heroIdx + (dx<0?1:-1)); startHero();
    }
  },{passive:true});
}
function showHero(i){
  const h=document.getElementById("hero");
  const slides=h.querySelectorAll(".hero-slide"), dots=h.querySelectorAll(".hero-dots span");
  if(!slides.length) return;
  heroIdx=(i+slides.length)%slides.length;
  slides.forEach((s,j)=>s.classList.toggle("on",j===heroIdx));
  dots.forEach((d,j)=>d.classList.toggle("on",j===heroIdx));
}
function startHero(){ clearInterval(heroTimer); heroTimer=setInterval(()=>showHero(heroIdx+1),6000); }

/* ----- Tarjetas y filas ----- */
function cardHTML(it){
  const badge = it.nuevo ? '<span class="badge new">Nuevo</span>'
    : `<span class="badge">${it.type==="pelicula"?"Película":"Serie"}</span>`;
  const ctype = it.type==="pelicula" ? "Película" : (it.eps+" eps");
  const langs=[]; if(it.dub)langs.push("DOB"); if(it.sub)langs.push("SUB");
  return `<div class="card" data-id="${esc(it.id)}">
    <div class="poster">${badge}
      <span class="crate"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${it.rating}</span>
      <span class="ctype">${ctype}</span>
      <img src="${img(it.poster)}" onerror="this.src='${FALL}'" alt=""/></div>
    <div class="ctitle">${esc(it.title)}</div>
    <div class="csub"><span>${it.year}</span>${langs.length?`<span class="lang">${langs.join(" · ")}</span>`:""}</div>
  </div>`;
}
function wideHTML(it){
  const epNum = it.type==="pelicula" ? "Película" : ("EP "+(it.eps||1));
  const lang = it.dub ? "LATINO" : (it.sub ? "SUB" : "");
  return `<div class="card-wide" data-id="${esc(it.id)}">
    <div class="thumb">
      <img src="${img(it.backdrop)}" onerror="this.src='${FALL}'" alt=""/>
      <span class="epchip">${epNum}</span>
      ${lang?`<span class="eplang">${lang}</span>`:""}
    </div>
    <div class="ctitle">${esc(it.title)}</div>
    <div class="csub">${it.type==="pelicula"?"Película nueva":("Nuevo episodio")}</div>
  </div>`;
}
function top10HTML(items){
  return `<div class="row top10 reveal"><div class="row-head"><div class="row-title">Top 10 hoy</div></div>
    <div class="row-scroll">${items.slice(0,10).map((it,i)=>`
      <div class="top10-card" data-id="${esc(it.id)}">
        <div class="top10-num">${i+1}</div>
        <div class="top10-pic">
          <div class="poster">
            <span class="trate"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${it.rating}</span>
            <img src="${img(it.poster)}" onerror="this.src='${FALL}'" alt=""/>
          </div>
          <div class="tname">${esc(it.title)}</div>
        </div>
      </div>`).join("")}</div></div>`;
}
function rowHTML(title,items,variant,rowId){
  if(!items.length) return "";
  const inner = variant==="wide" ? items.map(wideHTML).join("") : items.map(cardHTML).join("");
  return `<div class="row reveal"><div class="row-head"><div class="row-title">${esc(title)}</div>
    <button class="row-more" data-all="${rowId}">Ver todo ›</button></div>
    <div class="row-scroll">${inner}</div></div>`;
}

function renderRows(){
  const c=document.getElementById("rows");
  let html="";
  ROWS.forEach((r,i)=>{ html += rowHTML(r.title, DATA.filter(r.filter), r.variant, i); });
  html += top10HTML(DATA.slice().sort((a,b)=>b.rating-a.rating));
  c.innerHTML = html;
  c.querySelectorAll(".card,.card-wide,.top10-card").forEach(el=>{
    el.addEventListener("click",()=>{ const it=DATA.find(x=>x.id===el.dataset.id); if(it) go(it); });
  });
  // "Ver todo" → abre la cuadrícula de esa fila
  c.querySelectorAll("[data-all]").forEach(b=>{
    b.addEventListener("click",()=>{ const r=ROWS[+b.dataset.all]; openAll(r.title, DATA.filter(r.filter)); });
  });
  c.querySelectorAll(".row").forEach((row,i)=>row.style.animationDelay=(i*70)+"ms");
}

/* ----- "Ver todo": overlay con cuadrícula ----- */
function openAll(title, items){
  const ov=document.getElementById("allView");
  document.getElementById("allTitle").textContent=title;
  const grid=document.getElementById("allGrid");
  grid.innerHTML=items.map(cardHTML).join("");
  grid.querySelectorAll(".card").forEach(el=>el.addEventListener("click",()=>{const it=DATA.find(x=>x.id===el.dataset.id);if(it)go(it);}));
  ov.classList.add("open");
}
document.getElementById("allBack").addEventListener("click",()=>document.getElementById("allView").classList.remove("open"));

/* ----- Topbar sólida al hacer scroll ----- */

/* ----- Buscador (animado) ----- */
const search=document.getElementById("search"), sInput=document.getElementById("searchInput"), sRes=document.getElementById("searchResults");
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function openSearch(){ search.classList.add("open"); setTimeout(()=>sInput.focus(),250); searchEmpty(); }
function closeSearch(){ search.classList.remove("open"); sInput.value=""; }
document.getElementById("btnSearch").addEventListener("click",openSearch);
document.getElementById("searchBack").addEventListener("click",closeSearch);

function srItem(it,i){
  return `<div class="sr-item" data-id="${esc(it.id)}" style="animation-delay:${i*40}ms">
    <div class="poster"><img src="${img(it.poster)}" onerror="this.src='${FALL}'"/></div>
    <div><div class="t">${esc(it.title)}</div>
    <div class="s">${it.type==="pelicula"?"Película":"Serie"} · ${it.year}
      <span class="srate"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${it.rating}</span></div></div></div>`;
}
function bindResults(){ sRes.querySelectorAll(".sr-item").forEach(el=>el.addEventListener("click",()=>{const it=DATA.find(x=>x.id===el.dataset.id);if(it)go(it);})); }
function searchEmpty(){
  // sugerencias (más populares) cuando no hay texto
  const top=DATA.slice().sort((a,b)=>b.rating-a.rating).slice(0,6);
  sRes.innerHTML = '<div class="explore-sub" style="padding:6px 10px 10px">Sugerencias</div>' + top.map(srItem).join("");
  bindResults();
}
sInput.addEventListener("input",()=>{
  const q=norm(sInput.value);
  if(!q){ searchEmpty(); return; }
  const found=DATA.filter(d=>norm(d.title).includes(q)||d.genres.some(g=>norm(g).includes(q)));
  sRes.innerHTML = found.length ? found.map(srItem).join("")
    : '<div class="search-empty"><div class="ic">🔍</div><div class="big">Sin resultados</div><div>No encontramos nada para "'+esc(sInput.value)+'"</div></div>';
  bindResults();
});

/* ----- Navegación entre vistas ----- */
const RENDERED={home:true};
function switchView(v){
  document.querySelectorAll(".view").forEach(el=>el.classList.toggle("hidden", el.id!=="view-"+v));
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active", b.dataset.view===v));
  // el header global solo en Inicio (las demás tienen su propia cabecera)
  document.getElementById("topbar").classList.toggle("hidden", v!=="home");
  document.getElementById("app").scrollTop=0;
  if(v==="list") renderList();          // siempre refresca (favoritos pueden cambiar)
  else if(!RENDERED[v]){
    if(v==="explore") renderExplore();
    else if(v==="news") renderNews();
    else if(v==="account") renderAccount();
    RENDERED[v]=true;
  }
}
document.querySelectorAll(".nav-item").forEach(b=>{
  b.addEventListener("click",()=>switchView(b.dataset.view));
});

/* ----- Explorar ----- */
const GENRE_COLORS=["rgba(0,240,255,.82)","rgba(155,109,255,.78)","rgba(79,184,255,.8)","rgba(124,92,255,.78)","rgba(0,149,255,.8)","rgba(168,130,255,.78)"];
function renderExplore(){
  const genres=Array.from(new Set(DATA.flatMap(d=>d.genres)));
  const gc=document.getElementById("genreGrid");
  gc.innerHTML=genres.map((g,i)=>{
    const sample=DATA.find(d=>d.genres.includes(g));
    const c=GENRE_COLORS[i%GENRE_COLORS.length];
    return `<div class="genre-cell" data-g="${esc(g)}" style="--c:${c}">
      <div class="gimg" style="background-image:url('${img(sample&&sample.backdrop)}')"></div>
      <span class="gname">${esc(g)}</span>
      <span class="garrow"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>
    </div>`;
  }).join("");
  gc.querySelectorAll(".genre-cell").forEach(el=>el.addEventListener("click",()=>{
    const g=el.dataset.g; openAll(g, DATA.filter(d=>d.genres.includes(g)));
  }));
  // la barra de búsqueda de explorar abre el buscador
  const esx=document.getElementById("exploreSearch");
  if(esx) esx.addEventListener("click",openSearch);
  // filas de tendencias dentro de explorar
  const er=document.getElementById("exploreRows");
  er.innerHTML = '<h3 class="explore-sub">Tendencias</h3>'
    + rowHTML("Más populares", DATA.slice().sort((a,b)=>b.rating-a.rating), null, "pop");
  er.querySelectorAll(".card").forEach(el=>el.addEventListener("click",()=>{const it=DATA.find(x=>x.id===el.dataset.id);if(it)go(it);}));
  er.querySelectorAll("[data-all]").forEach(b=>b.addEventListener("click",()=>openAll("Más populares",DATA.slice().sort((a,b)=>b.rating-a.rating))));
}

/* ----- Mi lista — lee los MISMOS estados que guarda detalle.html -----
   El detalle guarda:  nekowolf_list_<título> = viendo|completado|pendiente|espera|abandonado
                       nekowolf_fav_<título>  = "1"
   Aquí leemos esos estados por el título de cada item del home. */
function statusOf(it){ try{return localStorage.getItem("nekowolf_list_"+it.title)||null;}catch(e){return null;} }
function isFav(it){ try{return localStorage.getItem("nekowolf_fav_"+it.title)==="1";}catch(e){return false;} }

// Mismas opciones que el modal de detalle + Favoritos y Todos
const LIST_TABS=[
  ["todos","Todos"],
  ["fav","Favoritos"],
  ["viendo","Viendo"],
  ["completado","Completado"],
  ["pendiente","Planeo ver"],
  ["espera","En espera"],
  ["abandonado","Abandonado"]
];
let listTab="todos";
function renderList(){
  const tabsEl=document.getElementById("listTabs");
  tabsEl.innerHTML=LIST_TABS.map(t=>`<button class="list-tab ${t[0]===listTab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join("");
  tabsEl.querySelectorAll(".list-tab").forEach(b=>b.addEventListener("click",()=>{
    listTab=b.dataset.t;
    tabsEl.querySelectorAll(".list-tab").forEach(x=>x.classList.toggle("on",x===b));
    showList(listTab);
  }));
  showList(listTab);
}
function showList(tab){
  const body=document.getElementById("listBody");
  let items;
  if(tab==="todos")      items=DATA.filter(d=>isFav(d)||statusOf(d));
  else if(tab==="fav")   items=DATA.filter(d=>isFav(d));
  else                   items=DATA.filter(d=>statusOf(d)===tab);

  if(!items.length){
    const M={ todos:["📺","Tu lista está vacía","Añade animes desde la pantalla de detalle (botón Mi lista)."],
      fav:["🤍","Sin favoritos","Marca el corazón en el detalle para guardarlos aquí."],
      viendo:["▶️","Nada en curso","Marca un anime como \"Viendo\"."],
      completado:["✅","Nada completado aún",""],
      pendiente:["🔖","Nada planeado","Guarda animes como \"Planeo ver\"."],
      espera:["⏸️","Nada en espera",""],
      abandonado:["🚫","Nada abandonado",""] }[tab]||["📺","Vacío",""];
    body.innerHTML=`<div class="empty"><div class="ic">${M[0]}</div><div class="big">${M[1]}</div><div>${M[2]}</div></div>`;
    return;
  }
  const STLBL={viendo:"Viendo",completado:"Completado",pendiente:"Planeo ver",espera:"En espera",abandonado:"Abandonado"};
  body.innerHTML=`<div class="list-grid">${items.map(cardHTML).join("")}</div>`;
  body.querySelectorAll(".card").forEach(el=>{
    const it=DATA.find(x=>x.id===el.dataset.id);
    el.addEventListener("click",()=>{ if(it) go(it); });
    // etiqueta de estado/favorito en el subtítulo
    const st=it?statusOf(it):null, sub=el.querySelector(".csub");
    if(sub && (st || (it&&isFav(it)))){
      const s=document.createElement("span");
      s.className="lstatus"+((!st&&isFav(it))?" fav":"");
      s.textContent = st ? (STLBL[st]||st) : "♥";
      sub.appendChild(s);
    }
  });
}

/* ============================================================
   ALIMENTACIÓN DESDE EL FEED DE BLOGGER
   Convierte cada post del feed al formato de DATA. Usa JSONP
   (evita problemas de CORS en apps empaquetadas / WebView).
   ============================================================ */
function feedUrl(){
  var base=(BLOG.URL||"").replace(/\/+$/,"");
  return base+"/feeds/posts/default?alt=json&max-results="+(BLOG.MAX||150)+"&callback=";
}
function fetchFeed(){
  return new Promise(function(resolve,reject){
    var cb="__nwfeed_"+Math.random().toString(36).slice(2);
    var s=document.createElement("script"), done=false;
    window[cb]=function(data){ done=true; resolve(data); clean(); };
    function clean(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
    s.onerror=function(){ if(!done){ reject(new Error("No se pudo cargar el feed")); clean(); } };
    s.src=feedUrl()+cb;
    document.head.appendChild(s);
    setTimeout(function(){ if(!done){ reject(new Error("Timeout del feed")); clean(); } },15000);
  });
}
function nrm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function hiRes(u){ return u?u.replace(/\/s\d+(-c)?\//,"/s1600/").replace(/=s\d+(-c)?$/,"=s1600"):u; }
function firstImg(html){ var m=(html||"").match(/<img[^>]+src=["']([^"']+)["']/i); return m?hiRes(m[1]):null; }
function stripTags(html){ var d=document.createElement("div"); d.innerHTML=html||""; return (d.textContent||"").trim(); }
function hasWord(labels,words){ return labels.some(function(l){ return (words||[]).some(function(w){ return nrm(l).indexOf(nrm(w))!==-1; }); }); }
function countEps(html){ var m=(html||"").match(/\[EP\]/gi); return m?m.length:0; }

/* URL personalizada del post: la que TÚ pones en el contenido de la entrada.
   Acepta cualquiera de estas formas (usa la que prefieras en Blogger):
     [URL]https://tusitio.com/lo-que-sea[/URL]
     url: https://tusitio.com/lo-que-sea
     enlace: https://tusitio.com/lo-que-sea
     link: https://tusitio.com/lo-que-sea
   (también funciona si la pones dentro de un bloque [NW]...[/NW]) */
function customUrl(html){
  var text=stripTags(html||"");
  // 1) marcador explícito [URL]...[/URL]
  var m=text.match(/\[URL\]\s*([\s\S]*?)\s*\[\/URL\]/i);
  if(m && m[1]) return m[1].trim();
  // 2) línea "url:/enlace:/link: https://..."
  m=text.match(/(?:url|enlace|link)\s*[:：]\s*(https?:\/\/[^\s"'<>\[\]]+)/i);
  if(m && m[1]) return m[1].trim();
  return "";
}

function postToItem(entry){
  var title=entry.title?entry.title.$t:"Sin título";
  var html=(entry.content&&entry.content.$t)||(entry.summary&&entry.summary.$t)||"";
  var labels=(entry.category||[]).map(function(c){return c.term;});
  var poster=(entry.media$thumbnail&&entry.media$thumbnail.url)?hiRes(entry.media$thumbnail.url):firstImg(html);
  var postUrl=""; (entry.link||[]).forEach(function(l){ if(l.rel==="alternate") postUrl=l.href; });
  var id=entry.id?entry.id.$t.replace(/^.*post-/,""):postUrl;
  var year=(entry.published&&entry.published.$t)?(entry.published.$t.match(/\d{4}/)||[""])[0]:"";
  // rating: busca un número decimal en el contenido tras "rating" o deja 0
  var rm=stripTags(html).match(/rating\s*[:：]?\s*([\d.]+)/i); var rating=rm?rm[1]:"";
  return {
    id:id, title:title,
    type: hasWord(labels,BLOG.MOVIE_WORDS) ? "pelicula" : "serie",
    year: year, rating: rating||"",
    nuevo: labels.indexOf(BLOG.NUEVO_LABEL)!==-1,
    sub: hasWord(labels,BLOG.SUB_WORDS), dub: hasWord(labels,BLOG.DUB_WORDS),
    genres: labels.filter(function(l){ return BLOG.GENRES.some(function(g){return nrm(g)===nrm(l);}); }),
    eps: countEps(html)||1,
    poster: poster||"", backdrop: poster||"",
    openUrl: customUrl(html),   // URL personalizada que pones en la entrada (se abre al pulsar)
    postUrl: postUrl            // enlace del post en Blogger (respaldo si no hay openUrl)
  };
}

/* go(): al pulsar una entrada abre la URL PERSONALIZADA que definiste en la
   entrada (marcador [URL]...[/URL] o línea "url:"). Si la entrada no trae una,
   usa como respaldo la URL del propio post en Blogger.
   Intenta nueva pestaña y, si el WebView lo bloquea, navega en la misma vista. */
function go(item){
  if(!item){ return; }
  var target = item.openUrl || item.postUrl;
  if(!target){ alert("Esta entrada no tiene una URL configurada. Añade [URL]https://...[/URL] en el post."); return; }
  var w = null;
  try { w = window.open(target, "_blank", "noopener"); } catch (e) { w = null; }
  if (!w) { location.href = target; }
}

function renderAll(){ heroItems = DATA.slice(0,5); renderHero(); renderRows(); }

/* Overlay de estado (carga / vacío / error) — NO toca el contenido de #app */
function stateMsg(ic,title,sub){
  hideState();
  var o=document.createElement("div");
  o.id="nw-state";
  o.style.cssText="position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px 24px;color:var(--muted)";
  o.innerHTML='<div style="font-size:50px">'+ic+'</div>'
    +'<div style="font-size:18px;font-weight:800;color:#fff">'+title+'</div>'
    +'<div style="font-size:13px;max-width:320px">'+sub+'</div>';
  document.body.appendChild(o);
}
function hideState(){ var o=document.getElementById("nw-state"); if(o) o.remove(); }

function init(){
  var ok = BLOG.URL && !/ejemplo|tublog|TU-BLOG/i.test(BLOG.URL);
  if(!ok){
    stateMsg("⚙️","Configura tu blog",
      "Pon el dominio de tu Blogger (ej. https://tublog.blogspot.com) en <b>BLOG_URL</b> dentro de <b>config.js</b>, o en <b>BLOG.URL</b> del &lt;script&gt; de este HTML. Cada entrada del blog = un anime.");
    return;
  }
  stateMsg("<span style='display:inline-block;width:40px;height:40px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite'></span>","Cargando…","Obteniendo animes desde tu blog.");
  fetchFeed().then(function(data){
    var entries=(data&&data.feed&&data.feed.entry)||[];
    DATA = entries.map(postToItem).filter(function(x){return x.title;});
    if(!DATA.length){
      stateMsg("📭","Sin entradas","Tu blog no tiene publicaciones aún, o no coinciden con los géneros configurados.");
      return;
    }
    hideState();     // quita el loader y deja ver el contenido renderizado
    try{ renderAll(); }
    catch(e){ console.error(e); stateMsg("⚠️","Error al mostrar","Los datos llegaron pero no se pudieron renderizar: "+(e&&e.message||e)); }
  }).catch(function(err){
    stateMsg("⚠️","No se pudo cargar el feed",
      (err&&err.message?err.message:"Error")+". Revisa que <b>BLOG.URL</b> sea correcto y el blog sea público.");
  });
}

/* ----- Init ----- */
init();
